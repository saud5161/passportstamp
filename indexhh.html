<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار نوع الملاحظة</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="container">
        <h2>اختيار نوع الملاحظة</h2>

        <form id="mainForm">
            <!-- نوع الملاحظة -->
            <div class="input-group">
                <label for="noteType">نوع الملاحظة:</label>
                <select id="noteType" required>
                    <option value="">-- اختر نوع الملاحظة --</option>
                    <option value="انتهاء تأشيرة زيارة">انتهاء تأشيرة زيارة</option>
                    <option value="أقل من 6 أشهر">أقل من 6 أشهر</option>
                    <option value="عدم قبول بصمة راكب">عدم قبول بصمة راكب</option>
                    <option value="اشعار">اشعار</option>
                    <option value="إجازة عسكري قبل الوقت">إجازة عسكري قبل الوقت </option>     
                   <option value="عسكري الى دولة ممنوعة">عسكري الى دولة ممنوعة </option>
                   <option value="اختلاف اسم عند المغادرة">زيارة اختلاف اسم عند المغادرة </option>
                   <option value="اختلاف جنسية الراكب">اختلاف جنسية الراكب</option>
                    <option value="التكميل">التكميل</option>
                    <option value="نقل معلومات">نقل معلومات</option>
                </select>
            </div>

            <!-- زر انتقال -->
            <button type="button" id="nextButton">انتقال</button>
        </form>

        <!-- تعليمات لإنشاء اختصار للموقع على iPhone -->
        <div class="shortcut-instructions">
            <p>لإنشاء اختصار للموقع على iPhone، اتبع الخطوات التالية:</p>
            <ol>
                <li>اضغط على زر <strong>المشاركة</strong> في Safari.</li>
                <li>اختر <strong>إضافة إلى الشاشة الرئيسية</strong>.</li>
                <li>قم بتأكيد الاسم واضغط على <strong>إضافة</strong>.</li>
            </ol>
        </div>

        <!-- زر لإخبار المستخدم كيفية إنشاء الاختصار -->
        <button id="createShortcut">إضافة اختصار للموقع</button>
    </div>

    <script>
        // الرقم السري المشفر
        const correctPassword = "123123";

        // عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            // التحقق من وجود الرقم السري في localStorage
            const savedPassword = localStorage.getItem('savedPassword');

            // إذا تم حفظ الرقم السري مسبقًا، نقوم بتخطي الطلب
            if (savedPassword === correctPassword) {
                console.log("تم التحقق من الرقم السري بنجاح.");
            } else {
                // طلب الرقم السري إذا لم يكن محفوظًا
                let userPassword = prompt("أدخل كلمة المرور:");

                // التحقق من إلغاء العملية
                if (userPassword === null) {
                    window.close(); // إغلاق الصفحة إذا تم الضغط على إلغاء
                    return;
                }

                // التحقق من الرقم السري في حال كان خاطئًا
                if (userPassword !== correctPassword) {
                    alert("كلمة المرور غير صحيحة.");
                    window.close(); // إغلاق الصفحة إذا كانت كلمة المرور خاطئة
                    return;
                }

                // إذا كان الرقم السري صحيحًا، نقوم بتخزينه في localStorage
                localStorage.setItem('savedPassword', correctPassword);
            }

            // إذا كان الرقم السري صحيحًا، نسمح بالانتقال
            const nextButton = document.getElementById('nextButton');
            const noteTypeSelect = document.getElementById('noteType');

            nextButton.addEventListener('click', () => {
                const selectedNoteType = noteTypeSelect.value;

                if (!selectedNoteType) {
                    alert('يرجى اختيار نوع الملاحظة قبل الانتقال.');
                    return;
                }

                switch (selectedNoteType) {
                    case 'انتهاء تأشيرة زيارة':
                        window.location.href = 'visa_expiry.html';
                        break;
                    case 'أقل من 6 أشهر':
                        window.location.href = 'less_than_6_months.html';
                        break;
                    case 'اشعار':
                        window.location.href = 'want.html';
                        break;
                    case 'عدم قبول بصمة راكب':
                        window.location.href = 'noacspt.html';
                        break;
                        case 'إجازة عسكري قبل الوقت':
                        window.location.href = 'askeryafter.html';
                        break;
                        case 'عسكري الى دولة ممنوعة':
                        window.location.href = 'askrycontery.html';
                        break;
                        case 'اختلاف اسم عند المغادرة':
                        window.location.href = 'name.html';
                        break;
                        case 'اختلاف جنسية الراكب':
                        window.location.href = 'nationalityd.html';
                        break;
                        case 'التكميل':
                        window.location.href = 'presence.html';
                        break;
                        case 'نقل معلومات':
                        window.location.href = 'updut.html';
                        break;
                    default:
                        alert('نوع الملاحظة غير معروف.');
                }
            });

            // تنبيه لإضافة اختصار للموقع على iPhone
            document.getElementById('createShortcut').addEventListener('click', function() {
                alert("لإضافة اختصار لهذا الموقع، اضغط على زر المشاركة في Safari ثم اختر 'إضافة إلى الشاشة الرئيسية'.");
            });
        });
    </script>

</body>
</html>
