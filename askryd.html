<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عسكري لديه اختلاف وجهه</title>
    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style1.css">
    <!-- ربط مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ربط مكتبة moment.js و moment-hijri.js عبر CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js" integrity="sha512-C7Sd1R1S+RSZLJ1tSCG68oIucNwKMHk3qvtf8ZyxOGgP1G+EHyR4BTaPF8DStV+5AVOHtHKbl95Ez4U4u3+syA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-hijri/2.1.2/moment-hijri.min.js" integrity="sha512-7gWcw6oL4FLHSO7dcxI1gks0YJY0OxTu3HzdYa5l5QnK/eZgWYn6p7HjTmssxKZ1f5vN+Y3uE0PtOMa+b42v1g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

    <div class="container">
        <!-- نص باللون الأخضر في الأعلى -->
        <p class="info-text">هذه الصفحة للمساعدة في إنشاء خطابات الواتس اب لن يتم حفظ أي معلومات مذكورة</p>

        <h2>اختلاف وجهة عسكري</h2>

        <form id="militaryLeaveForm">
            <!-- نوع الملاحظة مُحدد مسبقًا -->
            <input type="hidden" id="noteType" value="إجازة عسكري قبل الوقت">

            <!-- حقول المسافر -->
            <div id="passengerFields">
                <div class="input-group">
                    <label for="name">الاسم:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="input-group">
                    <label for="nationality">الجنسية:</label>
                    <input type="text" id="nationality" name="nationality" required>
                </div>

                <div class="input-group">
                    <label for="passportNumber">رقم الجواز:</label>
                    <input type="text" id="passportNumber" name="passportNumber" placeholder="أدخل رقم الجواز" required>
                </div>

                <div class="input-group">
                    <label for="departurePlace">جهة المغادرة:</label>
                    <input type="text" id="departurePlace" name="departurePlace" required>
                </div>

                <div class="input-group">
                    <label for="flightNumber">رقم الرحلة:</label>
                    <input type="text" id="flightNumber" name="flightNumber" required>
                </div>

                <div class="input-group">
                    <label for="airlines">الخطوط:</label>
                    <input type="text" id="airlines" name="airlines" placeholder="أدخل اسم الخطوط الجوية" required>
                </div>
            </div>

            <!-- وقت الإقلاع -->
            <div class="input-group">
                <label for="departureTime">وقت الإقلاع:</label>
                <div id="departureTimeContainer">
                    <input type="number" id="departureHour" name="departureHour" placeholder="الساعة" min="0" max="23" oninput="enforceEnglishDigits(event)">
                    <span>:</span>
                    <input type="number" id="departureMinutes" name="departureMinutes" placeholder="الدقائق" list="minuteOptions" min="0" max="59" oninput="enforceEnglishDigits(event)">
                    <datalist id="minuteOptions">
                        <option value="00">
                        <option value="15">
                        <option value="30">
                        <option value="45">
                    </datalist>
                </div>
            </div>
<!-- موعد فتح البوابة -->
<div class="input-group">
    <label for="gateOpenHour">موعد فتح البوابة:</label>
    <div id="gateOpenTimeContainer">
        <input type="number" id="gateOpenHour" name="gateOpenHour" placeholder="الساعة" min="0" max="23" oninput="enforceEnglishDigits(event)">
        <span>:</span>
        <input type="number" id="gateOpenMinutes" name="gateOpenMinutes" placeholder="الدقائق" list="minuteOptions" min="0" max="59" oninput="enforceEnglishDigits(event)">
    </div>
</div>

            <!-- القطاع العسكري -->
            <div class="input-group">
                <label for="sector">قطاع العسكري:</label>
                <input type="text" id="sector" name="sector" placeholder="أدخل القطاع" required>
            </div>

            <!-- مدة الإجازة -->
            <div class="input-group">
                <label for="leaveDuration">مدة الإجازة:</label>
                <input type="text" id="leaveDuration" name="leaveDuration" placeholder="أدخل مدة الإجازة" required>
            </div>

            <!-- تاريخ بداية الإجازة -->
            <div class="input-group">
                <label for="leaveStartDate">تاريخ بداية الإجازة:</label>
                <div>
                    <select id="leaveDay" name="leaveDay">
                        <option value="">اليوم</option>
                        <!-- الأيام من 1 إلى 30 -->
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                    </select>

                    <select id="leaveMonth" name="leaveMonth">
                        <option value="">الشهر</option>
                        <!-- الشهور من 1 إلى 12 -->
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>

                    <select id="leaveYear" name="leaveYear">
                        <option value="">السنة</option>
                        <!-- السنوات من 1446 إلى 1449 -->
                        <option value="1446">1446</option>
                        <option value="1447">1447</option>
                        <option value="1448">1448</option>
                        <option value="1449">1449</option>
                    </select>
                </div>
            </div>

            <!-- الملاحظة القابلة للتعديل -->
            <div class="input-group">
                <label for="customNote">الملاحظة:</label>
                <textarea id="customNote" name="customNote" rows="5">عند الشروع في تسديد مغادرته اتضح انه من فئة العسكريين ولدية اجازة  محددة الوجهة (  ) ويرغب بسفر الى وجهة مختلفه
                </textarea>
            </div>

            <!-- زر إرسال مع أيقونة الواتساب -->
            <button type="button" id="submitButton">
                إرسال إلى الواتس اب
                <i class="fab fa-whatsapp"></i>
            </button>

            <!-- زر العودة للصفحة الرئيسية -->
            <button type="button" id="backButton" class="back-button">عودة</button>
        </form>
    </div>

    <!-- كود JavaScript مدمج -->
    <script>
        // عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            addEventListeners();
        });

        /***** زر العودة للصفحة الرئيسية *****/
        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'indexhh.html';
        });

        /***** الدالة الأساسية للإرسال للواتس *****/
        function submitForm() {
            const message = [];

            // 1) نسرد بيانات المسافر
            const travelerName = getInputValue("name");
            const travelerNationality = getInputValue("nationality");
            const travelerPassport = getInputValue("passportNumber");
            const departurePlace = getInputValue("departurePlace");
            const flightNumber = getInputValue("flightNumber");
            const airlinesVal = getInputValue("airlines");
            const sector = getInputValue("sector");
            const leaveDuration = getInputValue("leaveDuration");
            const leaveDay = getInputValue("leaveDay");
            const leaveMonth = getInputValue("leaveMonth");
            const leaveYear = getInputValue("leaveYear");
            const departureHour = getInputValue("departureHour");
            const departureMinutes = getInputValue("departureMinutes");
            const customNote = getInputValue("customNote");

            message.push(`*الاسم:* ${travelerName}`);
            message.push(`*الجنسية:* ${travelerNationality}`);
            message.push(`*رقم الجواز:* ${travelerPassport}`);
            message.push(`*جهة المغادرة:* ${departurePlace}`);
            message.push(`*رقم الرحلة:* ${flightNumber}`);
            message.push(`*الخطوط:* ${airlinesVal}`);
            message.push(`*قطاع العسكري:* ${sector}`);
            message.push(`*مدة الإجازة:* ${leaveDuration}`);

            // إضافة تاريخ بداية الإجازة إذا تم إدخاله
            if (leaveDay && leaveMonth && leaveYear) {
                message.push(`*تاريخ بداية الإجازة:* ${leaveDay}-${leaveMonth}-${leaveYear}`);
            }

            // إضافة وقت الإقلاع إذا تم إدخاله
            if (departureHour || departureMinutes) {
                message.push(`*وقت الإقلاع:* ${padNumber(departureHour)}:${padNumber(departureMinutes)}`);
            }
const gateOpenHour = getInputValue("gateOpenHour");
const gateOpenMinutes = getInputValue("gateOpenMinutes");
if (gateOpenHour || gateOpenMinutes) {
    message.push(`*موعد فتح البوابة:* ${padNumber(gateOpenHour)}:${padNumber(gateOpenMinutes)}`);
}

            // 2) إضافة الملاحظات القابلة للتعديل
            if (customNote) {
                message.push(`*الملاحظة:* ${customNote}`);
            }

            // 3) فتح الواتس
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message.join('\n'))}`;
            window.location.href = whatsappUrl; // إعادة توجيه النافذة الحالية إلى WhatsApp
        }

        /***** دالة للحصول على قيمة الحقل *****/
        function getInputValue(id) {
            const element = document.getElementById(id);
            return element ? element.value.trim() : '';
        }

        /***** دالة لإضافة صفر بادئ للأرقام أقل من 10 *****/
        function padNumber(number) {
            return number.toString().padStart(2, '0');
        }

        /***** إضافة مستمعي الأحداث *****/
        function addEventListeners() {
            const submitButton = document.getElementById("submitButton");
            if (submitButton) {
                submitButton.addEventListener('click', submitForm);
            }
        }

        /***** دالة لإجبار المستخدم على كتابة الأرقام بالإنجليزي فقط *****/
        function enforceEnglishDigits(event) {
            const input = event.target;
            input.value = input.value.replace(/[^\d]/g, '');
        }
    </script>

</body>
</html>
