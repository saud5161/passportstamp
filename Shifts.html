<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام التوزيع الرسمي</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #f1c40f;
            --bg: #f4f7f6;
            --danger: #e74c3c;
            --success: #27ae60;
            --font-ui: 'Tajawal', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg);
            margin: 0;
            padding-bottom: 60px;
            color: #333;
        }

        /* --- UI Styles --- */
        .app-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .app-title { margin: 0; font-size: 1.1rem; font-weight: bold; }

        .btn-action {
            padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer;
            font-family: var(--font-ui); font-size: 0.9rem; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-reset { background: rgba(231, 76, 60, 0.2); color: #ffadad; border: 1px solid rgba(231, 76, 60, 0.5); }
        .btn-pdf { background: var(--accent); color: var(--primary); }

        .add-staff-row { display: flex; gap: 8px; background: rgba(255,255,255,0.15); padding: 8px; border-radius: 6px; }
        .input-new-name { flex: 1; padding: 8px; border-radius: 4px; border: none; font-family: var(--font-ui); font-size: 0.9rem; }
        .btn-add-name { background: var(--success); color: white; border: none; border-radius: 4px; padding: 0 15px; cursor: pointer; font-weight: bold; }

        .sticky-bar {
            position: sticky; top: 110px; z-index: 900;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px);
            border-bottom: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .scroll-area { display: flex; overflow-x: auto; gap: 8px; padding: 10px; -webkit-overflow-scrolling: touch; }

        .chip {
            flex: 0 0 auto; padding: 8px 15px; background: #fff;
            border: 1px solid #dcdcdc; border-radius: 20px; font-size: 0.9rem;
            position: relative; transition: 0.2s; cursor: pointer;
        }
        .chip.selected { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .delete-badge {
            position: absolute; top: -5px; right: -5px; background: var(--danger); color: white;
            width: 18px; height: 18px; border-radius: 50%; font-size: 10px;
            display: flex; align-items: center; justify-content: center; border: 2px solid white;
        }

        .cnt-btn {
            flex: 0 0 45px; height: 45px; border: 2px solid #e0e0e0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            color: var(--primary); background: white; font-size: 1.1rem;
        }
        .cnt-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .cnt-btn.used { background: #eee; color: #ccc; pointer-events: none; border-color: transparent; }

        .action-row { padding: 15px; display: flex; gap: 10px; }
        .main-btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px; color: white;
            font-weight: bold; font-family: var(--font-ui); font-size: 1rem;
            opacity: 0.5; pointer-events: none;
        }
        .main-btn.ready { opacity: 1; pointer-events: auto; cursor: pointer; }
        .btn-single { background: var(--success); }
        .btn-merge { background: #f39c12; }

        .workspace { padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }

        .card {
            background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary); overflow: hidden;
        }
        .card.merged { border-top-color: #f39c12; }
        .card-header { padding: 10px 15px; background: #fbfbfb; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; font-weight: bold; color: var(--primary); }
        .card-body { padding: 10px; }
        
        .slot {
            background: #fff; border: 1px dashed #ccc; padding: 8px; margin-bottom: 8px;
            border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
        }
        .slot.filled { background: #eafaf1; border: 1px solid #abebc6; }
        .slot-text { font-weight: bold; font-size: 0.95rem; }
        .slot-sub { font-size: 0.75rem; color: #777; display: block; }

        /* =========================================
           تصميم تقرير PDF
           ========================================= */
        #pdf-report {
            display: none; 
            background: white;
            color: black;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            direction: rtl;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.3;
        }

        .pdf-header {
            text-align: center;
            border-bottom: 3px solid #2c3e50;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .pdf-title { font-size: 24px; font-weight: 800; color: #2c3e50; margin: 0; }
        .pdf-date { font-size: 14px; font-weight: bold; color: #555; }
        
        .pdf-container {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .pdf-column {
            flex: 1;
            width: 49%;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-bottom: 10px;
            border: 1px solid #bdc3c7;
        }
        
        .pdf-table th, .pdf-table td {
            border: 1px solid #bdc3c7;
            padding: 6px 8px;
            vertical-align: middle;
        }

        .pdf-table th {
            background-color: #2c3e50; 
            color: white;
            font-weight: bold;
            text-align: center;
            font-size: 12px;
        }

        .pdf-table tr:nth-child(even) {
            background-color: #f9f9f9; 
        }
        
        .pdf-cnt-badge {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 800;
            text-align: center;
            display: block;
            width: fit-content;
            margin: 0 auto;
            border: 1px solid #bdc3c7;
        }

        .pdf-staff-main { font-weight: bold; color: #000; display: block; font-size: 12px; }
        .pdf-staff-relief { font-size: 10px; color: #e67e22; display: block; margin-top: 2px; font-weight: bold; }

        .pdf-section-head {
            background: #34495e;
            color: #fff;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0;
            border-radius: 4px 4px 0 0;
        }

        .pdf-extra-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 11px;
            border: 1px solid #bdc3c7;
        }
        .pdf-extra-table td {
            border: 1px solid #bdc3c7;
            padding: 8px;
        }
        .pdf-extra-label {
            background: #ecf0f1;
            font-weight: bold;
            width: 25%;
            color: #2c3e50;
            text-align: center;
        }

        /* تم حذف كلاس الفوتر بالكامل من هنا */

    </style>
</head>
<body>

    <div class="app-header" id="mainHeader">
        <div class="header-top">
            <h1 class="app-title">توزيع الكاونترات</h1>
            <div style="display:flex; gap:10px;">
                <button class="btn-action btn-reset" onclick="resetSchedule()">↻ إعادة تعيين</button>
                <button class="btn-action btn-pdf" onclick="downloadPDF()">📄 حفظ PDF</button>
            </div>
        </div>
        <div class="add-staff-row">
            <input type="text" id="newStaffName" class="input-new-name" placeholder="أدخل اسم الموظف الجديد...">
            <button class="btn-action btn-add-name" onclick="addNewStaff()">+ حفظ</button>
        </div>
    </div>

    <div class="sticky-bar">
        <div style="padding:5px 15px 0; font-size:0.8rem; color:#777; display:flex; justify-content:space-between;">
            <span>الأفراد (اضغط للاختيار)</span>
            <span style="color:red; cursor:pointer;" onclick="toggleDeleteMode()" id="delModeBtn">[حذف من القائمة]</span>
        </div>
        <div class="scroll-area" id="staffContainer"></div>
        
        <div style="padding:5px 15px 0; font-size:0.8rem; color:#777;">الكاونترات</div>
        <div class="scroll-area" id="counterContainer"></div>
    </div>

    <div class="action-row">
        <button id="btnAdd" class="main-btn btn-single" onclick="createCard(false)">+ كاونتر فردي</button>
        <button id="btnMerge" class="main-btn btn-merge" onclick="createCard(true)">🔗 دمج كاونترين</button>
    </div>

    <div class="workspace" id="workspace"></div>

    <div class="workspace">
        <div class="card">
            <div class="card-header">
                الخدمة الذاتية <span style="color:green; cursor:pointer;" onclick="addExtraSlot('self')">+</span>
            </div>
            <div class="card-body" id="mobile-self"></div>
        </div>
        <div class="card">
            <div class="card-header">
                الإرشاد <span style="color:green; cursor:pointer;" onclick="addExtraSlot('guide')">+</span>
            </div>
            <div class="card-body" id="mobile-guide"></div>
        </div>
    </div>

    <div id="pdf-report">
        <div class="pdf-header">
            <div class="pdf-title">جدول البريكات</div>
            <div class="pdf-date" id="pdfDateStr"></div>
        </div>

        <div class="pdf-container">
            
            <div class="pdf-column">
                <div class="pdf-section-head">القائمة الأولى</div>
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th width="20%">الكاونتر</th>
                            <th width="80%">الموظف / التغطية</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-table-1"></tbody>
                </table>
            </div>

            <div class="pdf-column">
                <div class="pdf-section-head">القائمة الثانية</div>
                <table class="pdf-table">
                    <thead>
                        <tr>
                            <th width="20%">الكاونتر</th>
                            <th width="80%">الموظف / التغطية</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-table-2"></tbody>
                </table>

                <div class="pdf-section-head" style="margin-top:15px; background:#2c3e50;">مهام أخرى</div>
                <table class="pdf-extra-table">
                    <tr>
                        <td class="pdf-extra-label">الخدمة الذاتية</td>
                        <td id="pdf-self-cell"></td>
                    </tr>
                    <tr>
                        <td class="pdf-extra-label">الإرشاد</td>
                        <td id="pdf-guide-cell"></td>
                    </tr>
                </table>
            </div>

        </div>
        
        </div>

    <script>
        // --- Data ---
        let defaultStaff = [
            "محمد العتيبي", "رامي المطيري", "مساعد الطوب", "غنيه سهلي", "ابتهال القحطاني", 
            "أريج معافا", "معاذ الحبيب", "سلطان الرشيدي", "مصعب ال علوان", "عبدالله الحارثي", 
            "مطلق السلولي", "هاجر العنزي", "منيفه العتيبي", "نرجس الدوسري", "بشائر الفيفي", 
            "مريم الزهراني", "سامي البقمي", "عبدالسلام الحربي", "سالم هليل", "عبدالعزيز العريني", 
            "محمد نياف", "حسين العجلان", "مقرن المطيري", "علي الشهري", "عايد المطيري", 
            "سلمان السويح", "ساره العمري", "شروق العتيبي", "أحلام الشهري", "شايع العتيق", "ثامر العنزي"
        ];

        let state = {
            staff: [],
            cards: [],
            slots: {}
        };

        let temp = {
            selStaff: null,
            selCnt: [],
            deleteMode: false
        };

        // --- Init ---
        window.onload = () => {
            loadData();
            sortStaff();
            renderAll();
        };

        function loadData() {
            const saved = localStorage.getItem('official_sched_v5'); // New Key
            if(saved) {
                state = JSON.parse(saved);
                if(!state.staff || state.staff.length === 0) state.staff = [...defaultStaff];
            } else {
                state.staff = [...defaultStaff];
            }
        }

        function saveData() {
            localStorage.setItem('official_sched_v5', JSON.stringify(state));
            renderAll();
        }

        function sortStaff() {
            state.staff.sort((a, b) => a.localeCompare('ar'));
        }

        // --- Logic ---
        function resetSchedule() {
            if(confirm("هل تريد إعادة تعيين الجدول (إفراغ الخانات فقط)؟")) {
                state.cards = [];
                state.slots = {};
                saveData();
            }
        }

        function addNewStaff() {
            const input = document.getElementById('newStaffName');
            const name = input.value.trim();
            if(name) {
                if(state.staff.includes(name)) {
                    alert("الاسم موجود مسبقاً");
                    return;
                }
                state.staff.push(name);
                sortStaff();
                saveData();
                input.value = '';
                alert("تمت الإضافة بنجاح");
            }
        }

        function toggleDeleteMode() {
            temp.deleteMode = !temp.deleteMode;
            document.getElementById('delModeBtn').innerText = temp.deleteMode ? '[تم الانتهاء]' : '[حذف من القائمة]';
            renderStaff();
        }

        function removeStaffFromList(e, name) {
            e.stopPropagation();
            if(confirm(`حذف "${name}" نهائياً؟`)) {
                state.staff = state.staff.filter(n => n !== name);
                saveData();
            }
        }

        // --- Render UI ---
        function renderAll() {
            renderStaff();
            renderCounters();
            renderWorkspace();
            renderExtrasMobile();
            updateBtns();
        }

        function renderStaff() {
            const container = document.getElementById('staffContainer');
            container.innerHTML = '';
            const used = Object.values(state.slots);

            state.staff.forEach(name => {
                if(used.includes(name)) return;
                const div = document.createElement('div');
                div.className = `chip ${temp.selStaff === name ? 'selected' : ''}`;
                div.innerHTML = `${name} ${temp.deleteMode ? `<div class="delete-badge" onclick="removeStaffFromList(event, '${name}')">✕</div>` : ''}`;
                div.onclick = () => {
                    if(!temp.deleteMode) {
                        temp.selStaff = (temp.selStaff === name) ? null : name;
                        renderStaff();
                    }
                };
                container.appendChild(div);
            });
        }

        function renderCounters() {
            const container = document.getElementById('counterContainer');
            container.innerHTML = '';
            let assigned = [];
            state.cards.forEach(c => assigned.push(...c.nums));

            for(let i=1; i<=20; i++) {
                const btn = document.createElement('div');
                btn.className = `cnt-btn ${assigned.includes(i) ? 'used' : ''} ${temp.selCnt.includes(i) ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => {
                    if(temp.selCnt.includes(i)) temp.selCnt = temp.selCnt.filter(n=>n!==i);
                    else {
                        if(temp.selCnt.length >= 2) temp.selCnt.shift();
                        temp.selCnt.push(i);
                    }
                    renderAll();
                };
                container.appendChild(btn);
            }
        }

        function updateBtns() {
            const add = document.getElementById('btnAdd');
            const mrg = document.getElementById('btnMerge');
            add.className = `main-btn btn-single ${temp.selCnt.length===1 ? 'ready':''}`;
            mrg.className = `main-btn btn-merge ${temp.selCnt.length===2 ? 'ready':''}`;
        }

        function createCard(isMerge) {
            const nums = temp.selCnt.sort((a,b)=>a-b);
            state.cards.push({ id: Date.now().toString(), nums: nums, type: isMerge ? 'merged' : 'single' });
            temp.selCnt = [];
            saveData();
        }

        function deleteCard(id) {
            if(confirm('هل أنت متأكد من حذف هذا الكاونتر؟')) {
                Object.keys(state.slots).forEach(k => { if(k.startsWith(id)) delete state.slots[k]; });
                state.cards = state.cards.filter(c => c.id !== id);
                saveData();
            }
        }

        function renderWorkspace() {
            const ws = document.getElementById('workspace');
            ws.innerHTML = '';
            state.cards.forEach(c => {
                const el = document.createElement('div');
                el.className = `card ${c.type === 'merged' ? 'merged' : ''}`;
                let title = c.type==='merged' ? `${c.nums[0]} & ${c.nums[1]}` : `${c.nums[0]}`;
                let slots = '';
                if(c.type === 'single') {
                    slots += makeSlot(c.id+'_m', 'المستلم الأساسي');
                    slots += makeSlot(c.id+'_r', 'الراحة / الغطاء');
                } else {
                    slots += makeSlot(c.id+'_m1', `مستلم ${c.nums[0]}`);
                    slots += makeSlot(c.id+'_m2', `مستلم ${c.nums[1]}`);
                    slots += makeSlot(c.id+'_sh', 'مشترك / راحة');
                }
                el.innerHTML = `<div class="card-header"><span>كاونتر ${title}</span><span style="color:#c0392b; cursor:pointer;" onclick="deleteCard('${c.id}')">✕</span></div><div class="card-body">${slots}</div>`;
                ws.appendChild(el);
            });
        }

        function makeSlot(id, title) {
            const val = state.slots[id];
            return `<div class="slot ${val ? 'filled' : ''}" onclick="fillSlot('${id}')"><div><span class="slot-sub">${title}</span><span class="slot-text">${val || 'اضغط للإضافة'}</span></div>${val ? `<span style="color:red; font-weight:bold; padding:5px;" onclick="clearSlot(event, '${id}')">✕</span>` : ''}</div>`;
        }

        function fillSlot(id) {
            if(state.slots[id]) return;
            if(!temp.selStaff) { alert("اختر اسماً أولاً"); return; }
            state.slots[id] = temp.selStaff;
            temp.selStaff = null;
            saveData();
        }

        function clearSlot(e, id) {
            e.stopPropagation();
            delete state.slots[id];
            saveData();
        }

        function renderExtrasMobile() {
            fillExtraList('mobile-self', 'self');
            fillExtraList('mobile-guide', 'guide');
        }

        function fillExtraList(divId, prefix) {
            const div = document.getElementById(divId);
            div.innerHTML = '';
            let max = 0;
            Object.keys(state.slots).forEach(k => { if(k.startsWith(prefix)) max = Math.max(max, parseInt(k.split('_')[1])); });
            for(let i=1; i<=max+1; i++) { div.innerHTML += makeSlot(`${prefix}_${i}`, ''); }
        }

        function addExtraSlot() { alert("املأ الخانة الفارغة لتظهر خانة جديدة."); }

        // --- PDF Generation ---
        function downloadPDF() {
            document.getElementById('pdfDateStr').innerText = `التاريخ: ${new Date().toLocaleDateString('ar-SA')}`;
            
            const tb1 = document.getElementById('pdf-table-1');
            const tb2 = document.getElementById('pdf-table-2');
            tb1.innerHTML = ''; tb2.innerHTML = '';

            let sortedCards = [...state.cards].sort((a,b) => a.nums[0] - b.nums[0]);
            
            let midPoint = Math.ceil(sortedCards.length / 2);
            let leftCards = sortedCards.slice(0, midPoint);
            let rightCards = sortedCards.slice(midPoint);

            const createRow = (c) => {
                let row = document.createElement('tr');
                let badge = `<span class="pdf-cnt-badge">${c.nums.join(' & ')}</span>`;
                let content = '';

                if(c.type === 'single') {
                    let m = state.slots[c.id+'_m'] || '-';
                    let r = state.slots[c.id+'_r'] || '-';
                    content = `<span class="pdf-staff-main">${m}</span>${r !== '-' ? `<span class="pdf-staff-relief">تغطية: ${r}</span>` : ''}`;
                } else {
                    let m1 = state.slots[c.id+'_m1'] || '-';
                    let m2 = state.slots[c.id+'_m2'] || '-';
                    let sh = state.slots[c.id+'_sh'] || '-';
                    content = `
                        <div style="display:flex; justify-content:space-between;">
                            <span class="pdf-staff-main" style="font-size:11px">${c.nums[0]}: ${m1}</span>
                            <span class="pdf-staff-main" style="font-size:11px">${c.nums[1]}: ${m2}</span>
                        </div>
                        ${sh !== '-' ? `<span class="pdf-staff-relief" style="text-align:center;">مشترك: ${sh}</span>` : ''}
                    `;
                }
                row.innerHTML = `<td style="text-align:center;">${badge}</td><td>${content}</td>`;
                return row;
            };

            leftCards.forEach(c => tb1.appendChild(createRow(c)));
            rightCards.forEach(c => tb2.appendChild(createRow(c)));

            // إضافات
            document.getElementById('pdf-self-cell').innerText = getExtraText('self');
            document.getElementById('pdf-guide-cell').innerText = getExtraText('guide');

            const element = document.getElementById('pdf-report');
            element.style.display = 'block';

            const opt = {
                margin:       5,
                filename:     'جدول_البريكات.pdf',
                image:        { type: 'jpeg', quality: 0.99 },
                html2canvas:  { scale: 2, useCORS: true }, 
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.style.display = 'none';
            });
        }

        function getExtraText(prefix) {
            let names = [];
            Object.keys(state.slots).forEach(k => {
                if(k.startsWith(prefix) && state.slots[k]) names.push(state.slots[k]);
            });
            if (names.length === 0) return 'لا يوجد';
            // الفاصل بين الأسماء شرطة
            return names.join(' - ');
        }
    </script>
</body>
</html>
