<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توليد مستند A4</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet"/>
  <style>
    body { margin:0; padding:20px; direction:rtl; font-family:Arial,sans-serif; background:#f5f5f5; }
    .container { max-width:800px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align:center; margin-bottom:20px; }
    .input-group { margin-bottom:20px; }
    label { display:block; font-weight:bold; margin-bottom:8px; }
    input[type=text] { width:100%; padding:8px; font-size:14px; border:1px solid #ccc; border-radius:4px; }
    input[type=file] { display:block; margin-bottom:10px; }
    .img-preview { max-width:100%; height:auto; border:1px solid #ccc; border-radius:4px; }
    #cvSign { display:block; width:100%; height:100px; border:1px solid #ccc; border-radius:4px; touch-action:none; margin-bottom:10px; }
    .actions { text-align:center; }
    button { padding:10px 16px; font-size:16px; border:none; background:#007bff; color:#fff; border-radius:4px; cursor:pointer; margin:5px; }
    button:hover { background:#0056b3; }
  </style>
</head>
<body>
<div class="container">
  <h2>توليد مستند A4</h2>

  <div class="input-group">
    <label for="iqama">رقم الإقامة:</label>
    <input type="text" id="iqama" placeholder="أدخل رقم الإقامة">
  </div>
  <div class="input-group">
    <label for="fullname">اسم الفرد:</label>
    <input type="text" id="fullname" placeholder="أدخل الاسم الكامل">
  </div>

  <!-- Passport cropper -->
  <div class="input-group">
    <label>جواز السفر:</label>
    <input type="file" id="passportInput" accept="image/*" capture="environment">
    <img id="passportImg" class="img-preview" style="display:none;"/>
    <div class="actions">
      <button id="cropPassportBtn" style="display:none;">قص الجواز</button>
    </div>
  </div>

  <!-- Boarding cropper -->
  <div class="input-group">
    <label>بطاقة الصعود:</label>
    <input type="file" id="boardingInput" accept="image/*" capture="environment">
    <img id="boardingImg" class="img-preview" style="display:none;"/>
    <div class="actions">
      <button id="cropBoardingBtn" style="display:none;">قص البوردنق</button>
    </div>
  </div>

  <!-- Signature -->
  <div class="input-group">
    <label>التوقيع:</label>
    <canvas id="cvSign"></canvas>
    <button onclick="clearSign()">مسح التوقيع</button>
  </div>

  <div class="actions">
    <button onclick="generateDoc()">توليد المستند A4</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
  let passportCropper, boardingCropper;
  const passportInput = document.getElementById('passportInput');
  const passportImg = document.getElementById('passportImg');
  const cropPassportBtn = document.getElementById('cropPassportBtn');
  passportInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const url = URL.createObjectURL(file);
    passportImg.src = url; passportImg.style.display = 'block';
    passportImg.onload = () => {
      if (passportCropper) passportCropper.destroy();
      passportCropper = new Cropper(passportImg, { viewMode:1, autoCropArea:0.9, movable:false, zoomable:false });
      cropPassportBtn.style.display = 'inline-block';
    };
  });
  cropPassportBtn.addEventListener('click', () => {
    const canvas = passportCropper.getCroppedCanvas({ imageSmoothingQuality:'high' });
    passportCropper.destroy(); passportCropper = null;
    passportImg.src = canvas.toDataURL('image/jpeg',0.9);
    cropPassportBtn.style.display = 'none';
  });

  const boardingInput = document.getElementById('boardingInput');
  const boardingImg = document.getElementById('boardingImg');
  const cropBoardingBtn = document.getElementById('cropBoardingBtn');
  boardingInput.addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const url = URL.createObjectURL(file);
    boardingImg.src = url; boardingImg.style.display = 'block';
    boardingImg.onload = () => {
      if (boardingCropper) boardingCropper.destroy();
      boardingCropper = new Cropper(boardingImg, { viewMode:1, autoCropArea:0.9, movable:false, zoomable:false });
      cropBoardingBtn.style.display = 'inline-block';
    };
  });
  cropBoardingBtn.addEventListener('click', () => {
    const canvas = boardingCropper.getCroppedCanvas({ imageSmoothingQuality:'high' });
    boardingCropper.destroy(); boardingCropper = null;
    boardingImg.src = canvas.toDataURL('image/jpeg',0.9);
    cropBoardingBtn.style.display = 'none';
  });

  // Signature
  const signCanvas = document.getElementById('cvSign'); const signCtx = signCanvas.getContext('2d'); let drawing=false;
  function getPos(e) { const r=signCanvas.getBoundingClientRect(); return { x:(e.touches?e.touches[0].clientX:e.clientX)-r.left, y:(e.touches?e.touches[0].clientY:e.clientY)-r.top }; }
  ['mousedown','touchstart'].forEach(ev=>signCanvas.addEventListener(ev,e=>{ drawing=true; const p=getPos(e); signCtx.beginPath(); signCtx.moveTo(p.x,p.y);}));
  ['mousemove','touchmove'].forEach(ev=>signCanvas.addEventListener(ev,e=>{ if(!drawing)return; const p=getPos(e); signCtx.lineTo(p.x,p.y); signCtx.stroke(); }));
  ['mouseup','mouseleave','touchend'].forEach(ev=>signCanvas.addEventListener(ev,()=>drawing=false));
  function clearSign(){ signCtx.clearRect(0,0,signCanvas.width,signCanvas.height); }

  function generateDoc() {
    const iq = document.getElementById('iqama').value.trim();
    const name = document.getElementById('fullname').value.trim();
    if(!iq||!name||!passportImg.src||!boardingImg.src) return alert('يرجى إدخال البيانات وقص الصور');
    const imgP = passportImg.src;
    const imgB = boardingImg.src;
    const sig = signCanvas.toDataURL('image/png');
    const html = '<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><title>'+iq+'</title>'+
      '<style>@page{size:A4;margin:10mm}body{margin:0;padding:10mm;direction:rtl;font-family:Arial,sans-serif}.page{width:210mm;height:297mm;box-sizing:border-box}img{display:block;margin:8px auto;max-width:100%;height:auto}h3,p{text-align:right;margin:4px 0;font-size:14pt}</style>'+
      '</head><body><div class="page">'+
      '<h3>جواز السفر</h3><img src="'+imgP+'">'+
      '<h3>بطاقة الصعود</h3><img src="'+imgB+'">'+
      '<p><strong>رقم الإقامة:</strong> '+iq+'</p>'+ 
      '<p><strong>اسم الفرد:</strong> '+name+'</p>'+ 
      '<h3>التوقيع</h3><img src="'+sig+'" style="max-width:50mm;border:1px solid #ccc;border-radius:4px">'+
      '</div></body></html>';
    const newWin = window.open(); newWin.document.open(); newWin.document.write(html); newWin.document.close();
  }
</script>
</body>
</html>
