<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج التكميل</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* لتصغير حجم select */
        #numTravel {
            width: 120px; /* حجم أصغر قليلاً */
            padding: 5px;
        }

        /* إضافة المسافة بين زر الإرسال وزر العودة */
        #submitButton, #backButton {
            margin-bottom: 10px; /* إضافة مسافة قليلة بين الأزرار */
        }

        /* جعل كلمة غير الزامية باللون الأخضر */
        .optional {
            color: green;
            font-size: 0.9em;
        }

        /* تلوين النص في الأعلى باللون الأخضر */
        .info-text {
            color: green;
            font-size: 1.2em;
            text-align: center;
            margin-bottom: 20px;
        }

        /* تحسين زر الإرسال مع أيقونة الواتساب */
        #submitButton {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            background-color: #25d366;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        #submitButton i {
            margin-left: 10px;
            font-size: 20px;
        }

        /* تنسيق الحقول لتظهر بشكل جيد */
        .input-group {
            margin-bottom: 15px;
        }

        .date-container select {
            margin: 0 5px;
        }

        /* إضافة خطوط متقطعة بين المسافر */
        .dashed-line {
            border-top: 1px dashed #000;
            margin: 10px 0;
        }

        /* تعريض الموجود */
        .bold-text {
            font-weight: bold;
        }

        /* تنسيق خاص للموجود */
        .highlight-box {
            background-color: #f0f8ff;
            padding: 10px;
            margin-top: 10px;
            font-weight: bold;
            border-radius: 5px;
        }

        /* تنسيق الحقول المنفصلة الخاصة بـ الموجود */
        .field-box {
            background-color: #f8f8f8;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            font-weight: normal;
        }

        .field-box label {
            font-weight: bold;
        }

        /* تخصيص مربع النص الخاص باسم الضابط ليكون بنفس حجم مربع "اختار رتبة الضابط" */
        select {
            width: 100%; /* عرض كامل */
            padding: 10px;
            font-size: 16px; /* حجم أكبر */
        }

        /* تخصيص مربع النص الخاص بـ "اسم الضابط" ليأخذ نفس الحجم مثل "رتبة الضابط" */
        .full-width-select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            text-align: center;
        }

        /* تنسيق لـ container الخاص بـ "الموجود" */
        .available-container {
            background-color: #f0f8ff;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* إضافة تنسيق للنصوص التي تكون جنب بعضها */
        .inline-inputs {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* جعل حقل رتبة الضابط واسم الضابط بالقوة الكبيرة */
        .large-input {
            font-size: 18px; /* الحجم الكبير للنص */
            padding: 10px;
            width: 100%;
        }

        .large-input-label {
            font-size: 18px;
        }

        /* إزالة الخط العريض من اسم الضابط و رتبة الضابط */
        .no-bold {
            font-weight: normal;
        }

        /* تخصيص الحقول الرقمية فقط */
        .input-group input[type="number"] {
            width: 80px;
        }

        /* تنسيق لرسالة التنبيه في حالة عدم تطابق العدد */
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* لمنح حقل اسم الضابط عرضًا كاملاً ضمن الـinput-group */
        .officer-name-select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* تنسيق للتنبيه الجديد */
        .alert-green {
            background-color: #e6ffe6; /* لون خلفية أخضر فاتح */
            color: #008000;           /* لون النص أخضر غامق */
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .alert-green i {
            margin-right: 8px; /* مسافة صغيرة بين الأيقونة والنص */
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>نموذج التكميل</h2>

        <form id="completionForm">
            <!-- رئيس مناوبة -->
            <div class="input-group">
                <label for="shiftLeader">رئيس مناوبة:</label>
                <select id="shiftLeader" name="shiftLeader" required>
                    <option value="">-- اختر رئيس المناوبة --</option>
                    <option value="أ">أ</option>
                    <option value="ب">ب</option>
                    <option value="ج">ج</option>
                    <option value="د">د</option>
                </select>
            </div>

            <!-- صالة رقم -->
            <div class="input-group">
                <label for="hallNumber">*صالة رقم:</label>
                <select id="hallNumber" name="hallNumber" required>
                    <option value="">-- اختر صالة رقم --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <!-- رتبة الضابط -->
            <div class="input-group">
                <label for="officerRank" class="no-bold">*رتبة الضابط:</label>
                <select id="officerRank" name="officerRank" required class="full-width-select">
                    <option value="">-- اختر رتبة الضابط --</option>
                    <option value="ملازم">ملازم</option>
                    <option value="ملازم أول">ملازم أول</option>
                    <option value="نقيب">نقيب</option>
                    <option value="رائد">رائد</option>
                    <option value="مقدم">مقدم</option>
                    <option value="عقيد">عقيد</option>
                    <option value="عميد">عميد</option>
                </select>
            </div>

             <!-- اسم الضابط -->
             <div class="input-group">
                <label for="officerName" class="no-bold">اسم الضابط (اختياري):</label>
                <input list="officerNames" id="officerName" name="officerName" class="officer-name-select">
                <datalist id="officerNames">
                    <option value="أحمد علي العمري">
                    <option value="أحمد عادل الزهراني">
                    <option value="اسامه راشد المشوح">
                    <option value="الريان عبدالله الهويمل">
                    <option value="تركي عبدالله الزهراني">
                    <option value="تركي عبدالله الشبيلي">
                    <option value="جابر فتنان الحربي">
                    <option value="خالد عبدالله الحسين">
                    <option value="سعد عبدالعزيز الخشلان">
                    <option value="سعود فراج السهلي">
                    <option value="سعود محمد ال جبل">
                    <option value="صالح إبراهيم السالم">
                    <option value="صالح محمد الحميدان">
                    <option value="فايز سعيد الشهراني">
                    <option value="فواز عبدالعزيز الخليفة">
                    <option value="فهد علي المالكي">
                    <option value="فيصل عبدالإله الهرف">
                    <option value="فيصل سعد الضفيان">
                    <option value="فيصل عبدالله الكريديس">
                    <option value="فيصل منصور السعيد">
                    <option value="فيصل موسى المطيري">
                    <option value="ماجد عبدالعزيز السحيم">
                    <option value="مالك أحمد العنقري">
                    <option value="محمد عبدالله الرفاع">
                    <option value="محمد منير الدوسري">
                    <option value="معاذ ظفر آل دريس">
                    <option value="مهند فهد ال جلده">
                    <option value="ناصر دغش السبيعي">
                    <option value="نايف سلمان المطيري">
                    <option value="عبدالإله ضيف الله بن غميض">
                    <option value="عبدالمجيد دحيم العتيبي">
                    <option value="عبدالعزيز عبدالله آل مطلق">
                    <option value="عبدالعزيز عبدالله الحارثي">
                    <option value="عبدالله سعد المطيري">
                    <option value="عبدالله محمد البقمي">
                    <option value="عبدالله مازن المطيري">
                    <option value="عبدالرحمن راشد البنيه">
                    <option value="عبدالرحمن محمد العوشن">
                </datalist>
            </div>

            <!-- تنبيه جديد فوق القوة -->
            <div class="alert-green">
                <i class="fas fa-exclamation-circle"></i>
                يرجى تعبئة الخانات المطلوبة، سوف تظهر فقط الخانات التي تحتوي على العدد.
            </div>
            <!-- /تنبيه جديد -->

            <!-- القوة -->
            <div class="inline-inputs">
                <div class="input-group">
                    <label for="force" class="large-input-label">*القوة:</label>
                    <input type="number" id="force" name="force" oninput="calculateAvailable()" class="large-input">
                </div>

                <!-- إجازة -->
                <div class="input-group">
                    <label for="leave">*إجازة:</label>
                    <input type="number" id="leave" name="leave" oninput="calculateAvailable()">
                </div>

                <!-- إجازة أمومة -->
                <div class="input-group">
                    <label for="maternityLeave">*إجازة أمومة:</label>
                    <input type="number" id="maternityLeave" name="maternityLeave" oninput="calculateAvailable()">
                </div>
            </div>

            <div class="inline-inputs">
                <div class="input-group">
                    <label for="childBirthLeave">*إجازة وضع:</label>
                    <input type="number" id="childBirthLeave" name="childBirthLeave" oninput="calculateAvailable()">
                </div>
                <div class="input-group">
                    <label for="absence">*غياب:</label>
                    <input type="number" id="absence" name="absence" oninput="calculateAvailable()">
                </div>
                <div class="input-group">
                    <label for="delay">*تأخير:</label>
                    <input type="number" id="delay" name="delay" oninput="calculateAvailable()">
                </div>
            </div>

            <div class="inline-inputs">
                <div class="input-group">
                    <label for="rest">*راحة:</label>
                    <input type="number" id="rest" name="rest" oninput="calculateAvailable()">
                </div>
                <div class="input-group">
                    <label for="shift">*دوره:</label>
                    <input type="number" id="shift" name="shift" oninput="calculateAvailable()">
                </div>
                <div class="input-group">
                    <label for="detention">*توقيف:</label>
                    <input type="number" id="detention" name="detention" oninput="calculateAvailable()">
                </div>
            </div>

            <div class="inline-inputs">
                <div class="input-group">
                    <label for="assignment">*تكليف:</label>
                    <input type="number" id="assignment" name="assignment" oninput="calculateAvailable()">
                </div>
                <div class="input-group">
                    <label for="delegation">*انتداب:</label>
                    <input type="number" id="delegation" name="delegation" oninput="calculateAvailable()">
                </div>
                <div class="input-group">
                    <label for="permission">*استئذان:</label>
                    <input type="number" id="permission" name="permission" oninput="calculateAvailable()">
                </div>
            </div>

            <!-- موجود -->
            <div class="available-container">
                <label for="available">الموجود:</label>
                <input type="text" id="available" name="available" readonly class="highlight-box">
                <div id="error-message" class="error-message">تأكد من العدد! العدد غير مطابق للعدد في الأسفل.</div>
            </div>

            <!-- الكاونتر والحالات الأخرى -->
            <div class="field-box">
                <label for="counter">كاونتر:</label>
                <input type="number" id="counter" name="counter" oninput="calculateAvailable()">
            </div>
            <div class="field-box">
                <label for="selfService">بوابة:</label>
                <input type="number" id="selfService" name="selfService" oninput="calculateAvailable()">
            </div>

            <!-- إضافة حقل أعمال إدارية -->
            <div class="field-box">
                <label for="administrativeWork">أعمال إدارية:</label>
                <input type="number" id="administrativeWork" name="administrativeWork" oninput="calculateAvailable()">
            </div>

            <div class="field-box">
                <label for="businessMen">رجال أعمال:</label>
                <input type="number" id="businessMen" name="businessMen" oninput="calculateAvailable()">
            </div>

            <!-- قائمة -->
            <div class="field-box">
                <label for="businessList">قائمة:</label>
                <input type="number" id="businessList" name="businessList" oninput="calculateAvailable()">
            </div>

            <!-- الذاتية -->
            <div class="field-box">
                <label for="selfAutomated">الذاتية:</label>
                <input type="number" id="selfAutomated" name="selfAutomated" oninput="calculateAvailable()">
            </div>
            <!-- إرشاد -->
<div class="field-box">
    <label for="guidance">إرشاد:</label>
    <input type="number" id="guidance" name="guidance" oninput="calculateAvailable()">
</div>

            <!-- زر إرسال مع أيقونة الواتساب -->
            <button type="button" id="submitButton">
                إرسال إلى الواتس اب
                <i class="fab fa-whatsapp"></i>
            </button>

            <!-- زر العودة للصفحة الرئيسية -->
            <button type="button" id="backButton">عودة</button>
        </form>
    </div>

    <!-- كود JavaScript مدمج -->
    <script>
        // عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            addEventListeners();
        });

        /***** زر العودة للصفحة الرئيسية *****/
        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'indexhh.html';
        });

        /***** دالة للحصول على قيمة الحقل *****/
        function getInputValue(id) {
            const element = document.getElementById(id);
            return element ? element.value.trim() : '';
        }

        /***** دالة لحساب الموجود *****/
        function calculateAvailable() {
            // جمع الأعداد من الحقول المختلفة
            const force = parseInt(getInputValue("force") || 0);
            const leave = parseInt(getInputValue("leave") || 0);
            const maternityLeave = parseInt(getInputValue("maternityLeave") || 0);
            const childBirthLeave = parseInt(getInputValue("childBirthLeave") || 0);
            const absence = parseInt(getInputValue("absence") || 0);
            const delay = parseInt(getInputValue("delay") || 0);
            const rest = parseInt(getInputValue("rest") || 0);
            const shift = parseInt(getInputValue("shift") || 0);
            const detention = parseInt(getInputValue("detention") || 0);
            const assignment = parseInt(getInputValue("assignment") || 0);
            const delegation = parseInt(getInputValue("delegation") || 0);
            const permission = parseInt(getInputValue("permission") || 0);
            const guidance = parseInt(getInputValue("guidance") || 0);   // جديد

            // حساب الموجود
            const totalLeave = leave + maternityLeave + childBirthLeave + absence + delay + rest + shift + detention + assignment + delegation + permission;
            const available = force - totalLeave;

            // عرض الموجود في الحقل
            document.getElementById("available").value = available;

            // حساب مجموع الكاونتر والبوابة والأعمال الإدارية ورجال الأعمال والقائمة والذاتية
            const counter = parseInt(getInputValue("counter") || 0);
            const selfService = parseInt(getInputValue("selfService") || 0);
            const administrativeWork = parseInt(getInputValue("administrativeWork") || 0);
            const businessMen = parseInt(getInputValue("businessMen") || 0);
            const businessList = parseInt(getInputValue("businessList") || 0);
            const selfAutomated = parseInt(getInputValue("selfAutomated") || 0);

            const total = counter + selfService + administrativeWork + businessMen
            + businessList + selfAutomated + guidance;        // أضف guidance

            // التحقق من تطابق العدد
            const errorMessage = document.getElementById("error-message");
            if (total !== available) {
                errorMessage.style.display = "block";
                errorMessage.innerText = "تأكد من العدد! العدد غير مطابق للعدد في الأسفل.";
            } else {
                errorMessage.style.display = "none";
            }
        }

        /***** دالة للإرسال للواتس *****/
        function submitForm() {
            const message = [];

            // إضافة البيانات إلى الرسالة
            message.push(`المناوبة / ${getInputValue("shiftLeader")} سفر ${getInputValue("hallNumber")}`);
            message.push(`رئيس المناوبة`);
            
            // عرض رتبة الضابط واسم الضابط
            message.push(`${getInputValue("officerRank")} / ${getInputValue("officerName")}`);
            
            message.push(`القوة / ${getInputValue("force")}`);

            // إضافة المعطيات الأخرى فقط إذا كانت تحتوي على أرقام
            const fields = [
                { label: 'الراحة', value: getInputValue("rest") },
                { label: 'إجازة', value: getInputValue("leave") },
                { label: 'إجازة أمومة', value: getInputValue("maternityLeave") },
                { label: 'تكليف', value: getInputValue("assignment") },
                { label: 'غياب', value: getInputValue("absence") },
                { label: 'دورة', value: getInputValue("shift") },
                { label: 'إجازة وضع', value: getInputValue("childBirthLeave") },
                { label: 'تأخير', value: getInputValue("delay") },
                { label: 'توقيف', value: getInputValue("detention") },
                { label: 'انتداب', value: getInputValue("delegation") },
                { label: 'استئذان', value: getInputValue("permission") }
            ];

          fields.forEach(field => {
    if (field.value) {
        // أضف السطر المعتاد
        message.push(`${field.label} / ${field.value}`);

        // إن كان الحقل غياب، أضف سطرًا فارغًا بعده
        if (field.label === 'غياب') {
            message.push('');   // ← يُنشئ سطرًا فارغًا في الرسالة
        }
    }
});


            // موجود
            const موجود = getInputValue("available");
            const additionalFields = [];
            if (getInputValue("counter")) additionalFields.push(`${getInputValue("counter")} كاونتر`);
            if (getInputValue("selfService")) additionalFields.push(`${getInputValue("selfService")} بوابة`);
            if (getInputValue("administrativeWork")) additionalFields.push(`${getInputValue("administrativeWork")} أعمال إدارية`);
            if (getInputValue("businessMen")) additionalFields.push(`${getInputValue("businessMen")} رجال أعمال`);
            if (getInputValue("businessList")) additionalFields.push(`${getInputValue("businessList")} قائمة`);
            if (getInputValue("selfAutomated")) additionalFields.push(`${getInputValue("selfAutomated")} الذاتية`);
            if (getInputValue("guidance")) additionalFields.push(`${getInputValue("guidance")} إرشاد`);

            if (additionalFields.length > 0) {
                message.push(`الموجود ${موجود} (${additionalFields.join(' + ')})`);
            } else {
                message.push(`الموجود ${موجود}`);
            }

            // إرسال الرسالة عبر الواتساب
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message.join('\n'))}`;
            window.location.href = whatsappUrl; // Redirect to WhatsApp
        }

        /***** إضافة مستمعي الأحداث *****/
        function addEventListeners() {
            const submitButton = document.getElementById("submitButton");
            if (submitButton) {
                submitButton.addEventListener('click', submitForm);
            }
        }
    </script>

</body>
</html>
