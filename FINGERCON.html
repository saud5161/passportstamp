<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>توجيه لراكب –لديه ارتباط بصمه</title>
  <!-- نفس الفكرة: تنسيق خارجي وأيقونات -->
  <link rel="stylesheet" href="style1.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <div class="container">
    <p class="info-text">هذه الصفحة للمساعدة في إنشاء خطابات الواتس اب، لن يتم حفظ أي معلومات.</p>
    <h2>توجيه لراكب – المعطيات الجديدة</h2>

    <form id="formNewTemplate">
      <!-- الحقول المطلوبة حسب طلبك -->
      <div class="input-group">
        <label for="fullName">الاسم:</label>
        <input type="text" id="fullName" name="fullName" required placeholder="أدخل الاسم" />
      </div>

      <div class="input-group">
        <label for="nationality">الجنسية:</label>
        <input type="text" id="nationality" name="nationality" required placeholder="أدخل الجنسية" />
      </div>

      <div class="input-group">
        <label for="passportNumber">رقم الجواز:</label>
        <input type="text" id="passportNumber" name="passportNumber" required placeholder="أدخل رقم الجواز" style="direction:ltr" />
      </div>

      <div class="input-group">
        <label for="visaType">نوع التأشيرة:</label>
        <input type="text" id="visaType" name="visaType" placeholder="زيارة / عمل / عمرة ..." />
      </div>

      <div class="input-group">
        <label for="residencyOrBorder">رقم الإقامة/الحدود:</label>
        <input type="text" id="residencyOrBorder" name="residencyOrBorder" placeholder="أدخل رقم الإقامة أو الحدود" style="direction:ltr" />
      </div>

      <div class="input-group">
        <label for="airlines">الخطوط:</label>
        <input type="text" id="airlines" name="airlines" placeholder="أدخل اسم شركة الطيران" />
      </div>

      <div class="input-group">
        <label for="flightNumber">رقم الرحلة:</label>
        <input type="text" id="flightNumber" name="flightNumber" placeholder="مثال: XY123" style="direction:ltr" />
      </div>

      <div class="input-group">
        <label for="destination">والمتجهة:</label>
        <input type="text" id="destination" name="destination" placeholder="مثال: القاهرة / دبي" />
      </div>

      <!-- مدخلان اختياريان لملء الفراغات داخل نص الملاحظة -->
      <div class="input-group">
        <label for="otherNationality">جنسية الوافد الآخر (اختياري):</label>
        <input type="text" id="otherNationality" name="otherNationality" placeholder="لملء (.......) الأولى" />
      </div>

      <div class="input-group">
        <label for="inquiryResult">نتيجة الاستعلام بالطرق الأربعة (اختياري):</label>
        <select id="inquiryResult" name="inquiryResult">
          <option value="">-- اختر النتيجة --</option>
          <option value="موجود">موجود</option>
          <option value="غير موجود">غير موجود</option>
        </select>
      </div>

      <!-- الملاحظة النهائية (معبأة تلقائياً) -->
      <div class="input-group">
        <label for="notes">الملاحظة:</label>
        <textarea id="notes" name="notes" rows="9" placeholder="سيتم توليد النص تلقائياً ويمكنك تعديله قبل الإرسال"></textarea>
      </div>

      <button type="button" id="submitButton">
        إرسال إلى الواتس اب
        <i class="fab fa-whatsapp"></i>
      </button>

      <button type="button" id="backButton" class="back-button">عودة</button>
    </form>
  </div>

  <script>
    // عند التحميل: جهّز النص تلقائيًا وتوصيلات الأزرار
    document.addEventListener('DOMContentLoaded', () => {
      wireEvents();
      fillNote();
    });

    // زر عودة (يمكنك تعديل المسار حسب مشروعك)
    document.getElementById('backButton').addEventListener('click', () => {
      window.location.href = 'indexhh.html';
    });

    function wireEvents() {
      const autoFields = [
        'fullName','nationality','passportNumber','visaType','residencyOrBorder',
        'airlines','flightNumber','destination','otherNationality','inquiryResult'
      ];
      autoFields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', fillNote);
      });

      const submitBtn = document.getElementById('submitButton');
      if (submitBtn) submitBtn.addEventListener('click', submitToWhatsApp);
    }

    function getVal(id){
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function fillNote() {
      const nationalityOther = getVal('otherNationality');
      const inquiryRes = getVal('inquiryResult');

      const placeholderOther = nationalityOther || '.......';
      const placeholderInquiry = inquiryRes || '.......';

      const text = `رجعنا الموضح بياناته أعلاه بقصد المغادرة وعند الشروع في إنهاء إجراءات مغادرته تعذر قبول الخصائص الحيوية وعند الرجوع للتقارير اتضح وجود ارتباط بصمة على رقم الإقامة مع وافد آخر من الجنسية ${placeholderOther} وبالرجوع إلى حالته اتضح بأنه خارج المملكة وتم الاستعلام عنه بالطرق الأربعة وتظهر النتيجة ( ${placeholderInquiry} ) وتم التشييك عليه في قوائم الممنوعين والمطلوبين وتبين عدم وجود ملاحظات أمنية`;

      const notes = document.getElementById('notes');
      if (notes) notes.value = text;
    }

    function submitToWhatsApp(){
      const name = getVal('fullName');
      const nat = getVal('nationality');
      const pass = getVal('passportNumber');
      const visa = getVal('visaType');
      const resid = getVal('residencyOrBorder');
      const airline = getVal('airlines');
      const flight = getVal('flightNumber');
      const dest = getVal('destination');
      const notes = getVal('notes');

      const lines = [];
      if (name) lines.push(`*الاسم:* ${name}`);
      if (nat) lines.push(`*الجنسية:* ${nat}`);
      if (pass) lines.push(`*رقم الجواز:* ${pass}`);
      if (visa) lines.push(`*نوع التأشيرة:* ${visa}`);
      if (resid) lines.push(`*رقم الإقامة/الحدود:* ${resid}`);
      if (airline) lines.push(`*الخطوط:* ${airline}`);
      if (flight) lines.push(`*رقم الرحلة:* ${flight}`);
      if (dest) lines.push(`*والمتجهة:* ${dest}`);

      if (notes) {
        lines.push('\n*الملاحظة:*');
        lines.push(notes);
      }

      // الخاتمة بحسب طلبك
      lines.push('\n*بأمل اطلاع سعادتكم والتوجيه ابقائها نفسها*');

      const url = `https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`;
      window.location.href = url;
    }
  </script>
</body>
</html>
