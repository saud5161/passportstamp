<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إشعار طيران خاص مغادرة</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="container">
        <p class="info-text">هذه الصفحة للمساعدة في إنشاء خطابات الواتس اب لن يتم حفظ أي معلومات مذكورة</p>

        <h2>إشعار طيران خاص مغادرة</h2>

        <form id="lessThanSixMonthsForm">
            <!-- الحقول المطلوبة -->
            <div class="input-group">
                <label for="departureHour">الساعة:</label>
                <input type="number" id="departureHour" name="departureHour" placeholder="الساعة" min="0" max="23">
                <span>:</span>
                <input type="number" id="departureMinutes" name="departureMinutes" placeholder="الدقائق" min="0" max="59">
                <select id="amPm" name="amPm">
                    <option value="من مساء  "> مساء  </option>
                    <option value="من صباح"> صباح</option>
                </select>
            </div>

            <div class="input-group">
                <label for="date">اليوم:</label>
                <input type="text" id="date" name="date" placeholder="اليوم">
            </div>

            <div class="input-group">
                <label for="hijriDate">الموافق:</label>
                <input type="text" id="hijriDate" name="hijriDate" placeholder="التاريخ الهجري">
            </div>

            <div class="input-group">
                <label for="destination">وجهة المغادرة:</label>
                <input type="text" id="destination" name="destination" placeholder="أدخل وجهة المغادرة">
            </div>

            <div class="input-group">
                <label for="registrationNumber">رقم التسجيل:</label>
                <input type="text" id="registrationNumber" name="registrationNumber" placeholder="أدخل رقم التسجيل">
            </div>

            <div class="input-group">
                <label for="onBoard">وعلى متنها (اذكر الوظيفة والاسم):</label>
                <input type="text" id="onBoard" name="onBoard" placeholder="أدخل الوظيفة والاسم">
            </div>

            <!-- الصفة الوظيفية والتلميحات -->
            <div class="input-group">
                <label for="position1">الصفة الوظيفية أو الجنسية:</label>
                <input type="text" id="position1" name="position1" placeholder="مثال: موظف">
            </div>

            <div class="input-group">
                <label for="additional1">ملاحظة إضافية:</label>
                <input type="text" id="additional1" name="additional1" placeholder="ملاحظة إضافية">
            </div>

            <!-- عدد المرافقين -->
            <div class="input-group">
                <label for="companionsCount">عدد المرافقين:</label>
                <input type="number" id="companionsCount" name="companionsCount" placeholder="عدد المرافقين" min="1" max="10" onchange="updateCompanionFields()">
            </div>

            <div class="input-group" id="companionsFields">
                <!-- ستتم إضافة الحقول هنا بناءً على عدد المرافقين -->
            </div>

            <button type="button" id="submitButton">إرسال إلى الواتس اب <i class="fab fa-whatsapp"></i></button>
            <button type="button" id="backButton" class="back-button">عودة</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            addEventListeners();
        });

        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'indexhh.html';
        });

        function submitForm() {
            const departureHour = getInputValue("departureHour");
            const departureMinutes = getInputValue("departureMinutes");
            const amPm = getInputValue("amPm");  // أخذ قيمة "صباح" أو "مساء"
            const date = getInputValue("date");
            const hijriDate = getInputValue("hijriDate");
            const destination = getInputValue("destination");
            const registrationNumber = getInputValue("registrationNumber");
            const onBoard = getInputValue("onBoard");
            const position1 = getInputValue("position1");
            const additional1 = getInputValue("additional1");
            const companionsCount = getInputValue("companionsCount");

            const message = [
                `*سيدي أدام الله عزكم*`,
                `عند الساعة ${departureHour}:${departureMinutes} ${amPm}  اليوم ${date} الموافق ${hijriDate} غادرت إلى ${destination} رحلة خاصة ذات التسجيل رقم (${registrationNumber}) عن طريق صالة الطيران الخاص بمطار الملك خالد الدولي وعلى متنها ${onBoard}`,
                `- ${position1}.`,  // إضافة الصفة الوظيفية
                `- ${additional1}`,  // إضافة ملاحظة إضافية مع سطر مستقل
                `*ويتم مرافقته عدد (${companionsCount}) أشخاص جنسياتهم على النحو التالي:*`,
                getCompanionsMessage(),
                `*تم إنهاء إجراءات مغادرتهم بدون ملاحظات*`,
                `*حفظكم الله سيدي*`
            ];

            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message.join('\n'))}`;
            window.location.href = whatsappUrl;
        }

        function getCompanionsMessage() {
            let companionsMessage = '';
            const companionsCount = parseInt(getInputValue("companionsCount"));
            for (let i = 1; i <= companionsCount; i++) {
                const companionCount = getInputValue(`companion${i}Count`);
                const companionNationality = getInputValue(`companion${i}Nationality`);
                companionsMessage += `(${companionCount}) ${companionNationality}\n`;
            }
            return companionsMessage;
        }

        function getInputValue(id) {
            const element = document.getElementById(id);
            return element ? element.value.trim() : '';
        }

        function updateCompanionFields() {
            const companionsCount = parseInt(document.getElementById('companionsCount').value);
            const companionsFields = document.getElementById('companionsFields');
            companionsFields.innerHTML = ''; // إعادة تعيين الحقول

            for (let i = 1; i <= companionsCount; i++) {
                companionsFields.innerHTML += `
                    <div class="companion-group">
                        <input type="number" id="companion${i}Count" name="companion${i}Count" placeholder="عدد الجنسية ${i}">
                        <input type="text" id="companion${i}Nationality" name="companion${i}Nationality" placeholder="الجنسية ${i}">
                    </div>
                `;
            }
        }

        function addEventListeners() {
            const submitButton = document.getElementById("submitButton");
            if (submitButton) {
                submitButton.addEventListener('click', submitForm);
            }
        }
    </script>

</body>
</html>
