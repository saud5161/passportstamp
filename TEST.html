<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ الجوازات الآلي (MRZ)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>

    <style>
        :root {
            --primary: #198754;
            --primary-dark: #0f3d28;
            --gold: #c5a059;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #2c3e50;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding-bottom: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--gold);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        header h1 { margin: 0; font-size: 1.4rem; font-weight: 800; }

        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }

        .scan-box {
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            height: 250px;
            margin-bottom: 20px;
            display: none; /* مخفي افتراضياً */
            border: 2px solid var(--gold);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 60px;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }
        
        .scan-status {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }

        .form-section {
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border-top: 4px solid var(--gold);
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 700; color: #444; }
        input {
            width: 100%; padding: 12px; border: 1px solid #e0e0e0;
            border-radius: 10px; font-size: 1rem; background-color: #fcfcfc;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--gold); background-color: #fff; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 50px;
            font-weight: bold; font-size: 1rem; color: white; cursor: pointer;
            margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-scan { background: var(--primary); }
        .btn-stop { background: #dc3545; display: none; }
        .btn-clear { background: #6c757d; }

        /* Loader */
        .loader {
            display: none;
            border: 4px solid #f3f3f3; border-top: 4px solid var(--gold);
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<header>
    <h1>قارئ الجوازات الآلي</h1>
</header>

<div class="container">

    <div id="cameraBox" class="scan-box">
        <video id="video" playsinline></video>
        <div class="scan-overlay"></div> <div class="scan-status" id="scanStatus">جاري تهيئة الكاميرا...</div>
    </div>

    <button id="startBtn" class="btn btn-scan" onclick="startCamera()">
        <i class="fas fa-camera"></i> تشغيل الكاميرا والمسح
    </button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopCamera()">
        <i class="fas fa-stop-circle"></i> إيقاف الكاميرا
        <div class="loader" id="loadingIcon"></div>
    </button>

    <div class="form-section">
        <div class="input-group">
            <label>الاسم (كما في الجواز)</label>
            <input type="text" id="p_name" placeholder="الاسم اللاتيني" style="direction: ltr; text-align: right;">
        </div>
        <div class="input-group">
            <label>رقم الجواز</label>
            <input type="text" id="p_number" class="en-num" style="direction: ltr;" placeholder="Passport Number">
        </div>
        <div class="input-group">
            <label>الجنسية (رمز الدولة)</label>
            <input type="text" id="p_nat" style="direction: ltr; text-align: right;" placeholder="SAU">
        </div>

        <button class="btn btn-clear" onclick="clearFields()">
            <i class="fas fa-eraser"></i> تفريغ الحقول
        </button>
    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('scanStatus');
    let stream = null;
    let isScanning = false;
    let scanInterval = null;

    // === تشغيل الكاميرا ===
    async function startCamera() {
        try {
            document.getElementById('cameraBox').style.display = 'block';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'flex';
            document.getElementById('loadingIcon').style.display = 'block';
            statusText.innerText = "يرجى توجيه الكاميرا على الرموز أسفل الجواز";

            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } // استخدام الكاميرا الخلفية
            });
            video.srcObject = stream;
            video.play();
            
            isScanning = true;
            // بدء عملية المسح الدوري كل 1.5 ثانية
            scanInterval = setInterval(processFrame, 1500);

        } catch (err) {
            alert("لا يمكن الوصول للكاميرا. تأكد من السماح بالأذونات وأن الموقع يعمل عبر HTTPS.");
            stopCamera();
        }
    }

    // === إيقاف الكاميرا ===
    function stopCamera() {
        isScanning = false;
        clearInterval(scanInterval);
        
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        
        document.getElementById('cameraBox').style.display = 'none';
        document.getElementById('startBtn').style.display = 'flex';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('loadingIcon').style.display = 'none';
    }

    // === معالجة الإطار الحالي ===
    function processFrame() {
        if (!isScanning) return;

        // رسم الصورة الحالية من الفيديو على الكانفاس
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // قص الجزء السفلي فقط (مكان MRZ عادة) لتحسين السرعة والدقة
        // أو إرسال الصورة كاملة. لنجرب الصورة كاملة أولاً.
        
        statusText.innerText = "جاري قراءة النصوص...";

        // استخدام Tesseract للتعرف على النص
        Tesseract.recognize(
            canvas,
            'eng', // اللغة الإنجليزية لأن MRZ إنجليزي
            { logger: m => console.log(m) } // لمتابعة التقدم في الكونسول
        ).then(({ data: { text } }) => {
            console.log("Text Detected:\n", text);
            parseMRZ(text);
        });
    }

    // === تحليل النص واستخراج MRZ ===
    function parseMRZ(text) {
        // تنظيف النص
        const lines = text.split('\n').map(l => l.replace(/\s/g, '').toUpperCase());
        
        let foundLine1 = null;
        let foundLine2 = null;

        // البحث عن نمط MRZ للجوازات (سطرين، 44 حرف)
        // السطر الأول يبدأ بـ P<
        // السطر الثاني يبدأ بأرقام وحروف
        
        for (let line of lines) {
            if (line.length > 30) { // طول تقريبي
                if (line.startsWith('P')) {
                    foundLine1 = line;
                } else if (line.match(/^[A-Z0-9]/) && line.includes('<')) {
                    // سطر ثاني محتمل يحتوي على أرقام و <
                    foundLine2 = line;
                }
            }
        }

        if (foundLine1 && foundLine2) {
            // محاولة الاستخراج
            try {
                // 1. الجنسية (من السطر الأول بعد P<XXX)
                // عادة تكون الأحرف 3 و 4 و 5
                // مثال: P<SAU...
                const typeCode = foundLine1.substring(0, 2); // P<
                let country = foundLine1.substring(2, 5).replace(/</g, '');
                
                // 2. الاسم (من السطر الأول بعد كود الدولة)
                // يأتي الاسم مفصولاً بـ <<
                let rawName = foundLine1.substring(5);
                let nameParts = rawName.split('<<');
                let surname = nameParts[0].replace(/</g, ' ');
                let givenNames = nameParts.length > 1 ? nameParts[1].split('<')[0] : '';
                let fullName = (surname + " " + givenNames).trim();

                // 3. رقم الجواز (من السطر الثاني، أول 9 خانات)
                let passportNum = foundLine2.substring(0, 9).replace(/</g, '');

                // التأكد من أن البيانات تبدو منطقية قبل التعبئة
                if (passportNum.length > 5 && country.length === 3) {
                    
                    // تعبئة الحقول
                    document.getElementById('p_name').value = fullName;
                    document.getElementById('p_nat').value = country;
                    document.getElementById('p_number').value = passportNum;

                    // نجاح! إيقاف الكاميرا
                    stopCamera();
                    alert("تم قراءة البيانات بنجاح!");
                    
                    // اهتزاز للتنبيه (لأجهزة الجوال)
                    if (navigator.vibrate) navigator.vibrate(200);
                }

            } catch (e) {
                console.log("Error parsing MRZ", e);
            }
        }
    }

    function clearFields() {
        document.getElementById('p_name').value = '';
        document.getElementById('p_number').value = '';
        document.getElementById('p_nat').value = '';
    }
</script>

</body>
</html>
