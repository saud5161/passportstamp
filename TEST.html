<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRZ Auto-Scanner</title>
    
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #0d6efd; --dark: #1a1a1a; --light: #ffffff; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

        /* الشاشة الرئيسية (زر البدء) */
        .start-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }
        .icon-box {
            width: 100px; height: 100px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .icon-box i { font-size: 40px; color: var(--primary); }
        .btn-start {
            background: var(--primary); color: white; border: none; padding: 15px 40px;
            font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3); transition: 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* شاشة الكاميرا (تظهر عند النقر) */
        .scanner-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 100; display: none;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* إطار التوجيه */
        .scan-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 25%; /* ارتفاع مناسب لمنطقة MRZ */
            border: 2px solid #00ff00; border-radius: 10px;
            box-shadow: 0 0 0 100vmax rgba(0,0,0,0.7); /* تعتيم الخلفية */
            overflow: hidden;
        }
        .scan-line {
            width: 100%; height: 2px; background: #00ff00; position: absolute; top: 0;
            box-shadow: 0 0 10px #00ff00; animation: scanAnim 2s infinite linear;
        }
        @keyframes scanAnim { 0% {top:0} 50% {top:100%} 100% {top:0} }
        
        .scan-text {
            position: absolute; bottom: 15%; width: 100%; text-align: center; color: white;
            font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 101;
        }
        .btn-close-cam {
            position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2);
            border: none; color: white; padding: 10px 20px; border-radius: 20px; z-index: 102;
        }

        /* شاشة النتائج */
        .result-screen {
            display: none; padding: 20px; background: white; border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); margin-top: auto; height: 70vh;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from {transform: translateY(100%)} to {transform: translateY(0)} }

        .field-group { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .lbl { font-size: 0.85rem; color: #888; display: block; margin-bottom: 5px; }
        .val { font-size: 1.1rem; font-weight: bold; color: #333; display: block; }
        .val.mono { font-family: monospace; letter-spacing: 1px; color: var(--primary); }

        /* لودر التحميل */
        .loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white;
            z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <i class="fas fa-cog fa-spin" style="font-size: 30px; color: var(--primary);"></i>
    <p style="margin-top:15px; color:#666;">تجهيز النظام...</p>
</div>

<div class="start-screen" id="startScreen">
    <div class="icon-box"><i class="fas fa-passport"></i></div>
    <h2>قارئ الجوازات الآلي</h2>
    <p style="color:#666; margin-bottom:30px;">اضغط الزر، وجه الكاميرا، وسيقوم النظام بالباقي.</p>
    <button class="btn-start" onclick="openCamera()"><i class="fas fa-camera"></i> ابدأ المسح</button>
</div>

<div class="scanner-overlay" id="scannerOverlay">
    <video id="video" playsinline muted autoplay></video>
    <div class="scan-guide">
        <div class="scan-line"></div>
    </div>
    <div class="scan-text">ضع الرموز السفلية <<<< داخل الإطار الأخضر</div>
    <button class="btn-close-cam" onclick="closeCamera()">إلغاء</button>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>
</div>

<div class="result-screen" id="resultScreen">
    <div style="text-align:center; color:green; margin-bottom:20px;">
        <i class="fas fa-check-circle" style="font-size:40px;"></i>
        <h3>تمت القراءة بنجاح</h3>
    </div>

    <div class="field-group">
        <span class="lbl">الاسم (English)</span>
        <span class="val" id="res_name">--</span>
    </div>
    <div class="field-group">
        <span class="lbl">رقم الجواز</span>
        <span class="val mono" id="res_doc">--</span>
    </div>
    <div class="field-group">
        <span class="lbl">الجنسية</span>
        <span class="val" id="res_nat">--</span>
    </div>
    <div class="field-group">
        <span class="lbl">تاريخ الانتهاء</span>
        <span class="val mono" id="res_exp">--</span>
    </div>

    <button class="btn-start" style="width:100%; margin-top:10px; background:#6c757d;" onclick="resetApp()">مسح جديد</button>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    let worker = null;
    let stream = null;
    let isScanning = false;
    let scanInterval = null;

    // === تهيئة المحرك مرة واحدة عند الفتح ===
    async function initWorker() {
        try {
            worker = Tesseract.createWorker();
            await worker.load();
            await worker.loadLanguage('eng');
            await worker.initialize('eng');
            // إجبار المحرك على قراءة الحروف والأرقام و < فقط لزيادة السرعة والدقة
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',
            });
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            alert('فشل تحميل المكتبة، تأكد من الإنترنت');
        }
    }

    // === تشغيل الكاميرا ===
    async function openCamera() {
        if (!worker) return;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('scannerOverlay').style.display = 'block';

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                isScanning = true;
                processFrame(); // بدء حلقة المعالجة
            };
        } catch (err) {
            alert("لا يمكن الوصول للكاميرا");
            closeCamera();
        }
    }

    // === إغلاق الكاميرا ===
    function closeCamera() {
        isScanning = false;
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('scannerOverlay').style.display = 'none';
        if(document.getElementById('resultScreen').style.display === 'none') {
            document.getElementById('startScreen').style.display = 'flex';
        }
    }

    // === معالجة الإطار (Loop) ===
    async function processFrame() {
        if (!isScanning) return;

        // 1. التقاط الصورة الحالية
        const w = video.videoWidth;
        const h = video.videoHeight;
        
        // قص منطقة الإطار الأخضر فقط (الوسط)
        // الإطار ارتفاعه 25% وفي المنتصف
        const cropW = w * 0.9;
        const cropH = h * 0.25;
        const cropX = (w - cropW) / 2;
        const cropY = (h - cropH) / 2;

        canvas.width = cropW;
        canvas.height = cropH;

        // رسم الجزء المقصوص
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        // 2. معالجة الصورة (زيادة التباين)
        // تحويل لأسود وأبيض ليسهل على النظام قراءة الحروف
        let imgData = ctx.getImageData(0, 0, cropW, cropH);
        let d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
            let avg = (d[i] + d[i + 1] + d[i + 2]) / 3;
            let val = avg < 100 ? 0 : 255; // عتبة اللون
            d[i] = d[i + 1] = d[i + 2] = val;
        }
        ctx.putImageData(imgData, 0, 0);

        // 3. التحليل
        const { data: { text } } = await worker.recognize(canvas);
        
        // 4. التحقق من النتيجة
        const result = parseMRZ(text);

        if (result) {
            // == نجاح! ==
            if(navigator.vibrate) navigator.vibrate(200); // اهتزاز
            displayResults(result); // عرض النتائج
            closeCamera(); // إغلاق الكاميرا فوراً
        } else {
            // إعادة المحاولة بعد وقت قصير
            requestAnimationFrame(processFrame);
        }
    }

    // === خوارزمية تحليل MRZ ===
    function parseMRZ(text) {
        // تنظيف النص
        const lines = text.split('\n').map(l => l.replace(/ /g, '').trim());
        
        // البحث عن سطر يبدأ بـ P< (الجواز)
        const line1 = lines.find(l => l.startsWith('P') && l.includes('<<'));
        // البحث عن سطر يبدأ برقم او حرف ويحتوي ارقام كثيرة
        const line2 = lines.find(l => l !== line1 && l.length > 20 && l.match(/[0-9]/));

        if (line1 && line2) {
            try {
                // استخراج البيانات
                const nat = line1.substring(2, 5).replace(/</g, '');
                const rawName = line1.substring(5).split('<<');
                const surname = rawName[0].replace(/</g, ' ').trim();
                const given = rawName.length > 1 ? rawName[1].split('<')[0].replace(/</g, ' ').trim() : '';
                
                const docNum = line2.substring(0, 9).replace(/</g, '');
                
                // تاريخ الانتهاء (تنسيق بسيط)
                let expY = line2.substring(21, 23);
                let expM = line2.substring(23, 25);
                let expD = line2.substring(25, 27);
                const expDate = `20${expY}-${expM}-${expD}`;

                // شرط الجودة: يجب ان يكون رقم الجواز 6 خانات على الاقل
                if (docNum.length < 6) return null;

                return {
                    name: surname + " " + given,
                    doc: docNum,
                    nat: nat,
                    exp: expDate
                };
            } catch (e) { return null; }
        }
        return null;
    }

    function displayResults(data) {
        document.getElementById('res_name').innerText = data.name;
        document.getElementById('res_doc').innerText = data.doc;
        document.getElementById('res_nat').innerText = data.nat;
        document.getElementById('res_exp').innerText = data.exp;
        
        document.getElementById('resultScreen').style.display = 'block';
    }

    function resetApp() {
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';
    }

    window.onload = initWorker;
</script>

</body>
</html>
