<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماسح الجوازات الاحترافي (Pro MRZ)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>

    <style>
        :root {
            --primary: #198754; --gold: #c5a059; --bg: #f0f2f5; --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px 10px;
        }

        .header {
            text-align: center; margin-bottom: 20px;
        }
        .header h2 { color: var(--primary); margin: 0; font-weight: 800; }
        .header p { color: #666; font-size: 0.9rem; margin-top: 5px; }

        /* منطقة الكاميرا */
        .camera-container {
            position: relative;
            width: 100%; max-width: 500px; height: 300px;
            margin: 0 auto 20px auto;
            background: #000; border-radius: 15px; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: none;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* إطار التوجيه (المنطقة الحمراء) */
        .scan-guide {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 60px;
            border: 2px solid rgba(255, 0, 0, 0.7);
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* تعتيم المناطق الخارجية */
            z-index: 10;
        }
        .scan-guide::after {
            content: 'ضع الرموز <<< هنا';
            position: absolute; top: -25px; left: 0; width: 100%;
            text-align: center; color: white; font-weight: bold; font-size: 0.8rem;
            text-shadow: 1px 1px 2px black;
        }

        .status-bar {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.8); color: white;
            padding: 8px; text-align: center; font-size: 0.85rem;
            z-index: 20;
        }

        /* النموذج والنتائج */
        .result-card {
            background: white; border-radius: 15px; padding: 20px;
            max-width: 500px; margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--gold);
        }

        .field { margin-bottom: 15px; position: relative; }
        .field label { display: block; font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 5px; }
        .field input {
            width: 100%; padding: 12px 10px 12px 40px; 
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 1rem; font-family: monospace; font-weight: bold;
            background: #fcfcfc; box-sizing: border-box;
        }
        .field i { position: absolute; left: 12px; top: 38px; color: #999; }

        /* الأزرار */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; color: white;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-start { background: var(--primary); }
        .btn-stop { background: #dc3545; display: none; }
        .btn-copy { background: #6c757d; }

        /* معاينة المعالجة (للمطور/للتأكد) - اجعلها مخفية */
        #debugCanvas { display: none; max-width: 100%; border: 1px solid red; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2><i class="fas fa-passport"></i> ماسح الجوازات الاحترافي</h2>
    <p>ضع سطر الرموز (MRZ) داخل الإطار الأحمر بدقة</p>
</div>

<div id="cameraContainer" class="camera-container">
    <video id="video" playsinline muted autoplay></video>
    <div class="scan-guide"></div>
    <div class="status-bar" id="status">جاري تشغيل الكاميرا...</div>
</div>

<div class="result-card">
    <div class="field">
        <label>الاسم الكامل (Latin Name)</label>
        <input type="text" id="mrz_name" placeholder="ALHAJJI SAUD" readonly>
        <i class="fas fa-user"></i>
    </div>
    
    <div class="field">
        <label>رقم الجواز (Passport Number)</label>
        <input type="text" id="mrz_number" placeholder="X12345678" readonly>
        <i class="fas fa-id-card"></i>
    </div>

    <div class="field">
        <label>الجنسية (Nationality)</label>
        <input type="text" id="mrz_nat" placeholder="SAU" readonly>
        <i class="fas fa-flag"></i>
    </div>

    <div class="btn-group">
        <button id="btnStart" class="btn btn-start" onclick="startScan()">
            <i class="fas fa-camera"></i> تشغيل المسح
        </button>
        <button id="btnStop" class="btn btn-stop" onclick="stopScan()">
            <i class="fas fa-stop"></i> إيقاف
        </button>
        <button class="btn btn-copy" onclick="copyData()">
            <i class="fas fa-copy"></i> نسخ
        </button>
    </div>
</div>

<canvas id="processingCanvas" style="display:none;"></canvas>

<script>
    let videoStream = null;
    let worker = null;
    let isScanning = false;
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('processingCanvas');
    const ctx = canvas.getContext('2d');

    // === 1. إعداد محرك Tesseract بدقة عالية ===
    async function initWorker() {
        statusEl.innerText = "جاري تحميل محرك الذكاء الاصطناعي...";
        worker = Tesseract.createWorker({
            logger: m => {
                if(m.status === 'recognizing text') {
                    statusEl.innerText = `جاري التحليل: ${Math.round(m.progress * 100)}%`;
                }
            }
        });
        
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        
        // **السر هنا**: إجبار المحرك على قراءة الحروف والأرقام و < فقط
        await worker.setParameters({
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',
        });
        statusEl.innerText = "المحرك جاهز. وجه الكاميرا.";
    }

    // === 2. تشغيل الكاميرا ===
    async function startScan() {
        if (!worker) await initWorker();

        document.getElementById('cameraContainer').style.display = 'block';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'flex';
        
        try {
            const constraints = { 
                video: { 
                    facingMode: "environment",
                    width: { ideal: 1920 }, // طلب دقة عالية
                    height: { ideal: 1080 }
                } 
            };
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = videoStream;
            
            isScanning = true;
            requestAnimationFrame(processFrame);
            
        } catch (err) {
            alert("لا يمكن الوصول للكاميرا. تأكد من استخدام HTTPS.");
            stopScan();
        }
    }

    // === 3. إيقاف المسح ===
    function stopScan() {
        isScanning = false;
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraContainer').style.display = 'none';
        document.getElementById('btnStart').style.display = 'flex';
        document.getElementById('btnStop').style.display = 'none';
    }

    // === 4. معالجة الصور (Image Processing Pipeline) ===
    async function processFrame() {
        if (!isScanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // أبعاد الفيديو
            const w = video.videoWidth;
            const h = video.videoHeight;
            
            // تحديد منطقة القص (المنتصف فقط حيث يوجد الإطار الأحمر)
            // نقص العرض بنسبة 80% والارتفاع بنسبة 20% من المنتصف
            const cropW = w * 0.9;
            const cropH = h * 0.25; 
            const cropX = (w - cropW) / 2;
            const cropY = (h - cropH) / 2;

            canvas.width = cropW;
            canvas.height = cropH;

            // 1. رسم المنطقة المقصوصة فقط
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            // 2. تحويل الصورة إلى تباين عالي (High Contrast Binarization)
            // هذا يجعل النص أسود والخلفية بيضاء تماماً
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                // تحويل لرمادي
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                // تطبيق Threshold (عتبة): إذا كان غامق اجعله أسود، فاتح اجعله أبيض
                const threshold = 100; // قيمة تجريبية لتباين الجوازات
                const color = avg < threshold ? 0 : 255;
                data[i] = color;     // R
                data[i + 1] = color; // G
                data[i + 2] = color; // B
            }
            ctx.putImageData(imageData, 0, 0);

            // 3. إرسال الصورة المعالجة للمحرك
            // ملاحظة: نقوم بذلك كل ثانية تقريباً وليس كل إطار لتخفيف الضغط
            if (!video.paused) {
                const { data: { text } } = await worker.recognize(canvas);
                parseMRZ(text);
            }
        }
        
        // إعادة التكرار (ولكن ببطء قليلاً لتوفير الموارد)
        if(isScanning) setTimeout(() => requestAnimationFrame(processFrame), 500); 
    }

    // === 5. تحليل البيانات بدقة (Regex & Parsing) ===
    function parseMRZ(text) {
        // تنظيف النص: إزالة المسافات والأسطر الفارغة
        const lines = text.split('\n')
            .map(l => l.replace(/[^A-Z0-9<]/g, '')) // حذف أي رمز ليس من القائمة
            .filter(l => l.length > 30); // أسطر MRZ طويلة عادة (44 حرف)

        // البحث عن سطر الجواز (الذي يبدأ بـ P)
        const line1 = lines.find(l => l.startsWith('P') || l.startsWith('I')); // جوازات أو هويات
        // البحث عن السطر الثاني (يحتوي أرقام كثيرة)
        const line2 = lines.find(l => l !== line1 && l.match(/[0-9]/) && l.length === line1?.length);

        if (line1 && line2) {
            try {
                // استخراج الدولة (الأحرف 3-5)
                const country = line1.substring(2, 5).replace(/</g, '');
                
                // استخراج الاسم (بعد الدولة حتى نهاية السطر)
                const nameSection = line1.substring(5);
                const names = nameSection.split('<<');
                const surname = names[0].replace(/</g, ' ').trim();
                const givenname = names.length > 1 ? names[1].split('<')[0].replace(/</g, ' ').trim() : '';
                
                // استخراج الرقم (أول 9 خانات من السطر الثاني)
                const number = line2.substring(0, 9).replace(/</g, '');

                // **التحقق النهائي**: هل الرقم منطقي؟
                if (number.length >= 6 && /^[A-Z0-9]+$/.test(number)) {
                    // نجاح!
                    document.getElementById('mrz_name').value = surname + " " + givenname;
                    document.getElementById('mrz_number').value = number;
                    document.getElementById('mrz_nat').value = country;
                    
                    // تنبيه صوتي
                    if(navigator.vibrate) navigator.vibrate(200);
                    
                    // إيقاف
                    stopScan();
                    statusEl.innerText = "تمت القراءة بنجاح";
                }
            } catch (e) {
                console.log("Parsing error", e);
            }
        }
    }

    function copyData() {
        const txt = `الاسم: ${document.getElementById('mrz_name').value}\nرقم الجواز: ${document.getElementById('mrz_number').value}\nالجنسية: ${document.getElementById('mrz_nat').value}`;
        navigator.clipboard.writeText(txt).then(() => alert("تم النسخ!"));
    }

    // تجهيز المحرك عند فتح الصفحة
    initWorker();

</script>

</body>
</html>
