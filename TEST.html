<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الجوازات الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* حاوية الفيديو */
        .camera-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* طبقة التراكب (Overlay) لرسم مربع التوجيه */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); /* تعتيم الخلفية */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* المربع الشفاف الذي يوضع فيه الجواز */
        .scan-box {
            width: 85%;
            height: 250px;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); /* حيلة لجعل ما حول المربع معتم */
            border-radius: 12px;
            position: relative;
            background: transparent;
        }

        /* زوايا المربع لتظهر بشكل احترافي */
        .scan-box::before, .scan-box::after {
            content: ''; position: absolute; width: 30px; height: 30px;
            border-color: #2563eb; border-style: solid;
        }
        .scan-box::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .scan-box::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }

        .scan-text {
            position: absolute;
            top: -40px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* أزرار التحكم في الأسفل */
        .controls {
            height: 120px;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            border-radius: 20px 20px 0 0;
        }

        .capture-btn {
            width: 70px;
            height: 70px;
            background: #fff;
            border: 6px solid #2563eb;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .capture-btn:active { transform: scale(0.9); background: #2563eb; }

        /* شاشة التحميل والنتائج */
        #result-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        
        .loader {
            border: 5px solid #f3f3f3; border-top: 5px solid #2563eb;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .data-box {
            background: #f3f4f6; padding: 15px; border-radius: 8px;
            width: 100%; max-width: 400px; margin-top: 10px;
            text-align: left; dir: ltr; font-family: monospace;
            max-height: 200px; overflow-y: auto;
        }
        
        .close-btn {
            margin-top: 20px; padding: 10px 30px;
            background: #dc2626; color: white; border: none;
            border-radius: 5px; font-size: 1rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay">
            <div class="scan-box">
                <div class="scan-text">ضع صفحة الجواز داخل الإطار</div>
            </div>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="controls">
        <button class="capture-btn" id="snapBtn" title="التقاط"></button>
    </div>

    <div id="result-modal">
        <div id="loading-ui">
            <div class="loader"></div>
            <h3>جاري تحليل البيانات...</h3>
            <p>يرجى الانتظار، يتم استخدام الذكاء الاصطناعي لقراءة النصوص.</p>
        </div>
        
        <div id="result-ui" style="display:none;">
            <h2 style="color: #059669;">تم التحليل بنجاح! <i class="fa-solid fa-check-circle"></i></h2>
            <div class="data-box" id="ocr-result">
                </div>
            <button class="close-btn" onclick="resetScanner()">مسح جديد</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snapBtn = document.getElementById('snapBtn');
        const resultModal = document.getElementById('result-modal');
        const loadingUi = document.getElementById('loading-ui');
        const resultUi = document.getElementById('result-ui');
        const resultText = document.getElementById('ocr-result');

        // 1. تشغيل الكاميرا الخلفية
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment", // الكاميرا الخلفية
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("يرجى السماح بالوصول للكاميرا لعمل الماسح الضوئي.");
                console.error("Error accessing camera:", err);
            }
        }

        startCamera();

        // 2. التقاط الصورة عند الضغط
        snapBtn.addEventListener('click', () => {
            // تجميد الفيديو لحظياً لإعطاء شعور الالتقاط
            video.pause();
            
            // ضبط حجم الكانفاس ليطابق الفيديو
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // رسم الصورة الحالية على الكانفاس
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // البدء في التحليل
            processImage();
        });

        // 3. تحليل الصورة باستخدام Tesseract.js
        function processImage() {
            resultModal.style.display = 'flex';
            loadingUi.style.display = 'block';
            resultUi.style.display = 'none';

            const image = canvas.toDataURL('image/png');

            Tesseract.recognize(
                image,
                'eng', // الجوازات عادة باللغة الإنجليزية في المنطقة المقروءة آلياً
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                showResult(text);
            }).catch(err => {
                alert("حدث خطأ أثناء التحليل");
                resetScanner();
            });
        }

        // 4. عرض النتائج
        function showResult(text) {
            loadingUi.style.display = 'none';
            resultUi.style.display = 'block';
            
            // تنظيف النص قليلاً
            resultText.innerText = text.trim();
            
            // يمكنك هنا إضافة كود لاستخراج رقم الجواز باستخدام Regex
            // مثال: const passportNumber = text.match(/[A-Z0-9]{9}/);
        }

        // 5. إعادة تعيين الماسح
        function resetScanner() {
            resultModal.style.display = 'none';
            video.play();
        }
    </script>
</body>
</html>
