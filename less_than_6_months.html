<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنويه: تم نقل الرابط</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --hover-color: #1d4ed8;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 5px solid var(--primary-color);
            animation: fadeIn 0.8s ease-in-out;
        }

        .icon-circle {
            background-color: #eff6ff;
            color: var(--primary-color);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 2rem;
        }

        .alert-text {
            color: #dc2626;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: block;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .timer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #6b7280;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-circle">
            <i class="fa-solid fa-share-from-square"></i>
        </div>
        
        <h1>تم نقل الموقع</h1>
        
        <p>
            نود إحاطتكم بأنه قد تم نقل محتوى هذا الرابط إلى صفحة جديدة بشكل دائم.
            <span class="alert-text"><i class="fa-solid fa-triangle-exclamation"></i> سيتم حذف هذه الصفحة قريباً.</span>
        </p>

        <a href="https://saud5161.github.io/passportstamp/indexhh.html" class="btn">
            <i class="fa-solid fa-arrow-pointer"></i>
            انقر هنا للانتقال للرابط الجديد
        </a>

        <div class="timer">
            سيتم تحويلك تلقائياً خلال <span id="countdown">10</span> ثوانٍ...
        </div>
    </div>

    <script>
        // كود بسيط للعد التنازلي والتحويل التلقائي
        let seconds = 10;
        const countdownEl = document.getElementById('countdown');
        const newUrl = "https://saud5161.github.io/passportstamp/indexhh.html";

        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = newUrl;
            }
        }, 1000);
    </script>

</body>
</html>
