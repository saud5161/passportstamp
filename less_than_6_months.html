<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدم قبول بصمة راكب</title>
    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style1.css">
    <!-- ربط مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ربط مكتبة moment.js و moment-hijri.js عبر CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js" integrity="sha512-C7Sd1R1S+RSZLJ1tSCG68oIucNwKMHk3qvtf8ZyxOGgP1G+EHyR4BTaPF8DStV+5AVOHtHKbl95Ez4U4u3+syA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-hijri/2.1.2/moment-hijri.min.js" integrity="sha512-7gWcw6oL4FLHSO7dcxI1gks0YJY0OxTu3HzdYa5l5QnK/eZgWYn6p7HjTmssxKZ1f5vN+Y3uE0PtOMa+b42v1g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

    <div class="container">
        <!-- نص باللون الأخضر في الأعلى -->
        <p class="info-text">هذه الصفحة للمساعدة في إنشاء خطابات الواتس اب لن يتم حفظ أي معلومات مذكورة</p>

        <h2>عدم قبول بصمة راكب</h2>

        <form id="lessThanSixMonthsForm">
            <!-- نوع الملاحظة مُحدد مسبقًا -->
            <input type="hidden" id="noteType" value="عدم قبول بصمة راكب">

            <!-- عدد المسافرين -->
            <div id="numPassengersContainer" class="input-group">
                <label for="numPassengers">عدد المسافرين:</label>
                <select id="numPassengers" name="numPassengers" required>
                    <option value="">-- اختر عدد المسافرين --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>

            <!-- حقول المسافرين -->
            <div id="passengerFields"></div>

            <!-- وقت الإقلاع -->
            <div class="input-group">
                <label for="departureHour">وقت الإقلاع:</label>
                <div id="departureTimeContainer">
                    <input type="number" id="departureHour" name="departureHour" placeholder="الساعة" min="0" max="23" oninput="enforceEnglishDigits(event)">
                    <span>:</span>
                    <input type="number" id="departureMinutes" name="departureMinutes" placeholder="الدقائق" list="minuteOptions" min="0" max="59" oninput="enforceEnglishDigits(event)">
                    <datalist id="minuteOptions">
                        <option value="00">
                        <option value="15">
                        <option value="30">
                        <option value="45">
                    </datalist>
                </div>
            </div>

            <!-- وجه السفر -->
            <div class="input-group">
                <label for="destination">وجه السفر:</label>
                <input type="text" id="destination" name="destination" placeholder="أدخل وجه السفر">
            </div>

            <!-- زر إرسال مع أيقونة الواتساب -->
            <button type="button" id="submitButton">
                إرسال إلى الواتس اب
                <i class="fab fa-whatsapp"></i>
            </button>

            <!-- زر العودة للصفحة الرئيسية -->
            <button type="button" id="backButton" class="back-button">عودة</button>
        </form>
    </div>

    <!-- كود JavaScript مدمج -->
    <script>
        // عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            addEventListeners();
            updatePassengerFields(); // لتوليد الحقول الافتراضية إذا كان العدد 1
        });

        /***** زر العودة للصفحة الرئيسية *****/
        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'indexhh.html';
        });

        /***** دالة تحديث حقول المسافرين *****/
        function updatePassengerFields() {
            const numPassengersSelect = document.getElementById("numPassengers");
            const numPassengers = parseInt(numPassengersSelect.value, 10) || 1;
            const passengerFieldsContainer = document.getElementById("passengerFields");
            passengerFieldsContainer.innerHTML = "";

            // إنشاء حقول المسافرين بناءً على عدد المسافرين المحدد
            for (let i = 1; i <= numPassengers; i++) {
                const passengerGroup = createPassengerGroup(i);
                passengerFieldsContainer.appendChild(passengerGroup);
            }
        }

        /***** إنشاء مجموعة حقول المسافر *****/
        function createPassengerGroup(index) {
            const passengerGroup = document.createElement("div");
            passengerGroup.className = "passenger-group";

            // عنوان المسافر
            const travelerHeader = document.createElement("h3");
            travelerHeader.textContent = `المسافر ${index}`;
            passengerGroup.appendChild(travelerHeader);

            // اسم المسافر
            const nameLabel = document.createElement("label");
            nameLabel.setAttribute("for", `name${index}`);
            nameLabel.textContent = "اسم المسافر:";
            passengerGroup.appendChild(nameLabel);

            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.id = `name${index}`;
            nameInput.name = `name${index}`;
            nameInput.required = true;
            passengerGroup.appendChild(nameInput);

            // رقم الجواز
            const passportLabel = document.createElement("label");
            passportLabel.setAttribute("for", `passportNumber${index}`);
            passportLabel.textContent = "رقم الجواز:";
            passengerGroup.appendChild(passportLabel);

            const passportInput = document.createElement("input");
            passportInput.type = "text";
            passportInput.id = `passportNumber${index}`;
            passportInput.name = `passportNumber${index}`;
            passportInput.placeholder = "أدخل رقم الجواز";
            passportInput.style.direction = "ltr";
            passportInput.required = true;
            passengerGroup.appendChild(passportInput);
// الجنسية
const nationalityLabel = document.createElement("label");
            nationalityLabel.setAttribute("for", `nationality${index}`);
            nationalityLabel.textContent = "الجنسية:";
            passengerGroup.appendChild(nationalityLabel);

            const nationalityInput = document.createElement("input");
            nationalityInput.type = "text";
            nationalityInput.id = `nationality${index}`;
            nationalityInput.name = `nationality${index}`;
            nationalityInput.placeholder = "سعودي";
            nationalityInput.required = true;
            passengerGroup.appendChild(nationalityInput);

            // تاريخ انتهاء الجواز (هجري)
            const expiryLabel = document.createElement("label");
            expiryLabel.setAttribute("for", `passportExpiry${index}`);
            expiryLabel.textContent = "تاريخ انتهاء الجواز (هجري):";
            passengerGroup.appendChild(expiryLabel);

            const expiryContainer = document.createElement("div");
            expiryContainer.className = "expiry-container";

            const dayInput = document.createElement("input");
            dayInput.type = "number";
            dayInput.id = `expiryDay${index}`;
            dayInput.name = `expiryDay${index}`;
            dayInput.placeholder = "اليوم";
            dayInput.min = 1;
            dayInput.max = 31;
            dayInput.required = true;
            expiryContainer.appendChild(dayInput);

            const monthInput = document.createElement("input");
            monthInput.type = "number";
            monthInput.id = `expiryMonth${index}`;
            monthInput.name = `expiryMonth${index}`;
            monthInput.placeholder = "الشهر";
            monthInput.min = 1;
            monthInput.max = 12;
            monthInput.required = true;
            expiryContainer.appendChild(monthInput);

            const yearInput = document.createElement("input");
            yearInput.type = "number";
            yearInput.id = `expiryYear${index}`;
            yearInput.name = `expiryYear${index}`;
            yearInput.placeholder = "السنة";
            yearInput.min = 1300;
            yearInput.max = 1500;
            yearInput.required = true;
            expiryContainer.appendChild(yearInput);

            passengerGroup.appendChild(expiryContainer);

            
            // المدة المتبقية
            const remainingLabel = document.createElement("label");
            remainingLabel.setAttribute("for", `remainingDuration${index}`);
            remainingLabel.textContent = "المدة المتبقية:";
            passengerGroup.appendChild(remainingLabel);

            const remainingContainer = document.createElement("div");
            remainingContainer.className = "remaining-container";

            const monthsInput = document.createElement("input");
            monthsInput.type = "number";
            monthsInput.id = `remainingMonths${index}`;
            monthsInput.name = `remainingMonths${index}`;
            monthsInput.placeholder = "عدد الأشهر";
            monthsInput.min = 0;
            monthsInput.required = true;
            remainingContainer.appendChild(monthsInput);

            const daysInput = document.createElement("input");
            daysInput.type = "number";
            daysInput.id = `remainingDays${index}`;
            daysInput.name = `remainingDays${index}`;
            daysInput.placeholder = "عدد الأيام";
            daysInput.min = 0;
            daysInput.max = 30;
            daysInput.required = true;
            remainingContainer.appendChild(daysInput);

            passengerGroup.appendChild(remainingContainer);

            // سبب السفر
            const reasonLabel = document.createElement("label");
            reasonLabel.setAttribute("for", `travelReason${index}`);
            reasonLabel.textContent = "سبب السفر:";
            passengerGroup.appendChild(reasonLabel);

            const reasonInput = document.createElement("input");
            reasonInput.type = "text";
            reasonInput.id = `travelReason${index}`;
            reasonInput.name = `travelReason${index}`;
            reasonInput.placeholder = "أدخل سبب السفر";
            reasonInput.required = true;
            passengerGroup.appendChild(reasonInput);

            // وثيقة السفر أقل من المدة النظامية
            const documentLabel = document.createElement("label");
            documentLabel.setAttribute("for", `documentNotes${index}`);
            documentLabel.textContent = "وثيقة السفر أقل من المدة النظامية:";
            passengerGroup.appendChild(documentLabel);

            const documentTextarea = document.createElement("textarea");
            documentTextarea.id = `documentNotes${index}`;
            documentTextarea.name = `documentNotes${index}`;
            documentTextarea.placeholder = "في حال وجود ملاحظات اضافية اكتب هنا...";
            documentTextarea.required = true;
            passengerGroup.appendChild(documentTextarea);

            return passengerGroup;
        }

        /***** دالة لإجبار المستخدم على كتابة الأرقام بالإنجليزي فقط *****/
        function enforceEnglishDigits(event) {
            const input = event.target;
            input.value = input.value.replace(/[^\d]/g, '');
        }

        /***** الدالة الأساسية للإرسال للواتس *****/
        function submitForm() {
            const numPassengersSelect = document.getElementById("numPassengers");
            const numPassengers = parseInt(numPassengersSelect.value, 10) || 1;
            const message = [];

            // 1) نسرد بيانات المسافرين
            for (let i = 1; i <= numPassengers; i++) {
                const travelerName = getInputValue(`name${i}`);
                const travelerPassport = getInputValue(`passportNumber${i}`);
                const travelerExpiryDay = getInputValue(`expiryDay${i}`);
                const travelerExpiryMonth = getInputValue(`expiryMonth${i}`);
                const travelerExpiryYear = getInputValue(`expiryYear${i}`);
                const travelerNationality = getInputValue(`nationality${i}`);
                const remainingMonths = getInputValue(`remainingMonths${i}`);
                const remainingDays = getInputValue(`remainingDays${i}`);
                const travelReason = getInputValue(`travelReason${i}`);
                const documentNotes = getInputValue(`documentNotes${i}`);
                const departureHour = getInputValue("departureHour");
                const departureMinutes = getInputValue("departureMinutes");
                const destinationVal = getInputValue("destination"); // تغيير من airlines إلى destination

                message.push(`*اسم المسافر:* ${travelerName}`);
                message.push(`*رقم الجواز:* ${travelerPassport}`);
                // تغيير تنسيق تاريخ الانتهاء إلى yyyy/mm/dd
                message.push(`*تاريخ انتهاء الجواز (هجري):* ${travelerExpiryYear}/${padNumber(travelerExpiryMonth)}/${padNumber(travelerExpiryDay)}`);
                message.push(`*الجنسية:* ${travelerNationality}`);
                message.push(`*المدة المتبقية:* ${remainingMonths} شهر و ${remainingDays} يوم`);
                message.push(`*سبب السفر:* ${travelReason}`);

                // إضافة وقت الإقلاع بعد حقل سبب السفر
                if (departureHour || departureMinutes) {
                    message.push(`*وقت الإقلاع:* ${padNumber(departureHour)}:${padNumber(departureMinutes)}`);
                }

                // إضافة وجه السفر بعد وقت الإقلاع
                if (destinationVal) {
                    message.push(`*وجه السفر:* ${destinationVal}`);
                }

                // إضافة الملاحظة بعد وجه السفر
                message.push(`*الملاحظة / وثيقة السفر أقل من المدة النظامية:* ${documentNotes}`);

                message.push("----");
            }

            // إزالة الفاصل الأخير
            if (message[message.length - 1] === "----") {
                message.pop();
            }

            // 2) ختام الرسالة
            message.push("\n*بأمل اطلاع سعادتكم والتوجيه*");

            // 3) فتح الواتس
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message.join('\n'))}`;
            window.location.href = whatsappUrl; // إعادة توجيه النافذة الحالية إلى WhatsApp
        }

        /***** دالة للحصول على قيمة الحقل *****/
        function getInputValue(id) {
            const element = document.getElementById(id);
            return element ? element.value.trim() : '';
        }

        /***** دالة لإضافة صفر بادئ للأرقام أقل من 10 *****/
        function padNumber(number) {
            return number.toString().padStart(2, '0');
        }

        /***** إضافة مستمعي الأحداث *****/
        function addEventListeners() {
            const numPassengersSelect = document.getElementById("numPassengers");
            if (numPassengersSelect) {
                numPassengersSelect.addEventListener('change', updatePassengerFields);
            }

            const submitButton = document.getElementById("submitButton");
            if (submitButton) {
                submitButton.addEventListener('click', submitForm);
            }
        }
    </script>

</body>
</html>
